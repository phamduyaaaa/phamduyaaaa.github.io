<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .track { fill: #40403A; }
    .body  { fill: #11110F; }
    .core  { fill: #B8924A; }
    .eye   { fill: #F7F5F0; }
    
    /* Ma thuật nằm ở đây: Tự động lật màu theo Tab trình duyệt */
    @media (prefers-color-scheme: dark) {
      .track { fill: #8A877E; }
      .body  { fill: #EAE5D9; }
      .core  { fill: #D4AF37; }
      .eye   { fill: #11110F; }
    }
  </style>

  <rect class="track" x="3" y="6" width="5" height="20" rx="2.5" />
  
  <rect class="track" x="24" y="6" width="5" height="20" rx="2.5" />
  
  <rect class="body" x="6" y="6" width="20" height="20" rx="6" />
  
  <circle class="core" cx="16" cy="16" r="6" />
  
  <circle class="eye" cx="18.5" cy="13.5" r="2" />
</svg>
