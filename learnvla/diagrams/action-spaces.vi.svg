<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">BỐN LỰA CHỌN ĐẰNG SAU MỘT VECTOR HÀNH ĐỘNG</text>
<rect class="dg-box" x="20" y="44" width="220" height="96"/><text class="dg-t" x="130" y="68" text-anchor="middle">1. Ra lệnh cho cái gì</text><text class="dg-s" x="130" y="90" text-anchor="middle">góc khớp (mỗi khớp một số)</text><text class="dg-s" x="130" y="106" text-anchor="middle">hoặc tư thế tay kẹp (x, y, z, quay)</text><text class="dg-s" x="130" y="122" text-anchor="middle">+ độ mở tay kẹp</text>
<rect class="dg-box" x="260" y="44" width="220" height="96"/><text class="dg-t" x="370" y="68" text-anchor="middle">2. Tuyệt đối hay delta</text><text class="dg-s" x="370" y="90" text-anchor="middle">"đi tới đây"</text><text class="dg-s" x="370" y="106" text-anchor="middle">hoặc "dịch đi chừng này"</text><text class="dg-s" x="370" y="122" text-anchor="middle">delta cộng dồn sai số</text>
<rect class="dg-key" x="500" y="44" width="220" height="96"/><text class="dg-t" x="610" y="68" text-anchor="middle">3. Mã hóa phép quay</text><text class="dg-s" x="610" y="90" text-anchor="middle">Euler: nhảy tại +-180 độ</text><text class="dg-s" x="610" y="106" text-anchor="middle">quaternion: q và -q như nhau</text><text class="dg-s" x="610" y="122" text-anchor="middle">6D: liên tục</text>
<rect class="dg-box" x="740" y="44" width="220" height="96"/><text class="dg-t" x="850" y="68" text-anchor="middle">4. Hệ trục và thang đo</text><text class="dg-s" x="850" y="90" text-anchor="middle">hệ gốc hay hệ dụng cụ</text><text class="dg-s" x="850" y="106" text-anchor="middle">chuẩn hóa từng chiều</text><text class="dg-s" x="850" y="122" text-anchor="middle">về khoảng [-1, 1]</text>
<rect class="dg-ext" x="260" y="190" width="460" height="56"/><text class="dg-t" x="490" y="214" text-anchor="middle">một vector hành động a_t, rồi một chunk a_t ... a_t+H-1</text><text class="dg-s" x="490" y="232" text-anchor="middle">policy chỉ học tốt khi mọi bộ dữ liệu dùng cùng một quy ước</text>
<path class="dg-a" d="M130 140 V170 H490 V190"/><path class="dg-a" d="M370 140 V170"/><path class="dg-a" d="M610 140 V170"/><path class="dg-a" d="M850 140 V170 H490"/>
</svg>
