<rect class="dg-ext" x="560" y="346" width="170" height="40"/><text class="dg-t" x="645" y="364" text-anchor="middle">Robot chân-bánh</text><text class="dg-s" x="645" y="378" text-anchor="middle">+ tay 6 bậc</text>
