<svg viewBox="0 0 980 310" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">TỪ DANH SÁCH TÁC VỤ LỆCH TỚI 100 TÁC VỤ ĐUÔI DÀI, CHẤM TRÊN ROBOT THẬT</text>
<rect class="dg-badbox" x="20" y="44" width="220" height="80"/><text class="dg-t" x="130" y="68" text-anchor="middle">danh sách tác vụ có sẵn</text><text class="dg-s" x="130" y="88" text-anchor="middle">OXE, Agibot, ...: phần lớn động từ</text><text class="dg-s" x="130" y="104" text-anchor="middle">là "gắp và giữ"</text>
<rect class="dg-box" x="280" y="44" width="220" height="80"/><text class="dg-t" x="390" y="68" text-anchor="middle">mở rộng theo thao tác</text><text class="dg-s" x="390" y="88" text-anchor="middle">tương tác người-vật</text><text class="dg-s" x="390" y="104" text-anchor="middle">+ affordance của vật</text>
<rect class="dg-key" x="540" y="44" width="200" height="80"/><text class="dg-t" x="640" y="68" text-anchor="middle">GM-100</text><text class="dg-s" x="640" y="88" text-anchor="middle">100 tác vụ, mỗi tác vụ có</text><text class="dg-s" x="640" y="104" text-anchor="middle">tiêu chí + video mẫu</text>
<rect class="dg-ext" x="780" y="44" width="180" height="80"/><text class="dg-t" x="870" y="68" text-anchor="middle">13K+ quỹ đạo</text><text class="dg-s" x="870" y="88" text-anchor="middle">điều khiển từ xa,</text><text class="dg-s" x="870" y="104" text-anchor="middle">mã mở</text>
<path class="dg-a" d="M240 84 H280"/><path class="dg-a" d="M500 84 H540"/><path class="dg-a" d="M740 84 H780"/>
<rect class="dg-box" x="20" y="170" width="280" height="80"/><text class="dg-t" x="160" y="194" text-anchor="middle">Agilex Cobot Magic</text><text class="dg-s" x="160" y="214" text-anchor="middle">kiểu Mobile-Aloha, camera đầu</text><text class="dg-s" x="160" y="230" text-anchor="middle">cả 100 tác vụ</text>
<rect class="dg-box" x="330" y="170" width="280" height="80"/><text class="dg-t" x="470" y="194" text-anchor="middle">Dobot Xtrainer</text><text class="dg-s" x="470" y="214" text-anchor="middle">kiểu Aloha, camera từ trên</text><text class="dg-s" x="470" y="230" text-anchor="middle">tác vụ 1-10: 100 học + 30 thử</text>
<rect class="dg-key" x="640" y="160" width="320" height="100"/><text class="dg-t" x="800" y="184" text-anchor="middle">ba điểm mỗi tác vụ</text><text class="dg-s" x="800" y="204" text-anchor="middle">SR: xong cả tác vụ</text><text class="dg-s" x="800" y="220" text-anchor="middle">PSR: tỉ lệ tác vụ con xong</text><text class="dg-s" x="800" y="236" text-anchor="middle">sai số hành động trên 30 demo giữ lại</text>
<path class="dg-a" d="M870 124 V142 H160 V170"/><path class="dg-a" d="M470 142 V170"/><path class="dg-a" d="M610 210 H640"/>
<text class="dg-l" x="20" y="290">tác vụ được chọn theo lẽ thường vật lý và affordance mức làm-thế-nào, không theo độ hữu ích trong nhà</text>
</svg>
