<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">WHERE FORCE CAN BE MEASURED, FROM THE BASE TO THE FINGERTIP</text>
<rect class="dg-box" x="20" y="60" width="210" height="96"/><text class="dg-t" x="125" y="84" text-anchor="middle">joints</text><text class="dg-s" x="125" y="104" text-anchor="middle">torque sensors or motor current</text><text class="dg-s" x="125" y="120" text-anchor="middle">force estimated by tau = J^T F</text><text class="dg-s" x="125" y="136" text-anchor="middle">no extra hardware; friction errs</text>
<rect class="dg-key" x="260" y="60" width="210" height="96"/><text class="dg-t" x="365" y="84" text-anchor="middle">wrist F/T sensor</text><text class="dg-s" x="365" y="104" text-anchor="middle">6 numbers: Fx Fy Fz Tx Ty Tz</text><text class="dg-s" x="365" y="120" text-anchor="middle">fast; includes tool weight</text><text class="dg-s" x="365" y="136" text-anchor="middle">cannot tell where contact is</text>
<rect class="dg-box" x="500" y="60" width="210" height="96"/><text class="dg-t" x="605" y="84" text-anchor="middle">pressure / taxel arrays</text><text class="dg-s" x="605" y="104" text-anchor="middle">piezoresistive, capacitive</text><text class="dg-s" x="605" y="120" text-anchor="middle">a coarse map, e.g. 12 x 12</text><text class="dg-s" x="605" y="136" text-anchor="middle">where and how hard</text>
<rect class="dg-key" x="740" y="60" width="220" height="96"/><text class="dg-t" x="850" y="84" text-anchor="middle">vision-based tactile</text><text class="dg-s" x="850" y="104" text-anchor="middle">gel + camera (GelSight)</text><text class="dg-s" x="850" y="120" text-anchor="middle">fine shape, slip, ~30 Hz</text><text class="dg-s" x="850" y="136" text-anchor="middle">force must be inferred</text>
<path class="dg-a" d="M230 108 H260"/><path class="dg-a" d="M470 108 H500"/><path class="dg-a" d="M710 108 H740"/>
<text class="dg-l" x="20" y="186">closer to the base: cheaper, already there, less precise about the contact</text>
<text class="dg-l" x="520" y="186">closer to the fingertip: richer contact, more fragile</text>
<rect class="dg-badbox" x="20" y="220" width="440" height="70"/><text class="dg-t" x="240" y="246" text-anchor="middle">common mistakes</text><text class="dg-s" x="240" y="266" text-anchor="middle">reading the tool's weight as contact force; forgetting the frame;</text><text class="dg-s" x="240" y="282" text-anchor="middle">zeroing once and then tilting the tool</text>
<rect class="dg-box" x="500" y="220" width="460" height="70"/><text class="dg-t" x="730" y="246" text-anchor="middle">what a policy should receive</text><text class="dg-s" x="730" y="266" text-anchor="middle">gravity-compensated, bias-free wrench in a known frame,</text><text class="dg-s" x="730" y="282" text-anchor="middle">normalised, often as a short history window</text>
</svg>
