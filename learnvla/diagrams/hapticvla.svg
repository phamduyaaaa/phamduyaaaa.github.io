<svg viewBox="0 0 980 400" xmlns="http://www.w3.org/2000/svg">
<rect class="dg-grp" x="10" y="8" width="960" height="170"/><text class="dg-h" x="22" y="26">STAGE 1 · TEACHER (uses tactile, offline)</text>
<rect class="dg-ext" x="20" y="44" width="190" height="48"/><text class="dg-t" x="115" y="62" text-anchor="middle">Tactile maps M^L, M^R</text><text class="dg-s" x="115" y="77" text-anchor="middle">10×10 + manipulator state</text>
<rect class="dg-box" x="250" y="44" width="160" height="48"/><text class="dg-t" x="330" y="62" text-anchor="middle">Offline tactile reward</text><text class="dg-s" x="330" y="77" text-anchor="middle">r_t · R_episode · risk</text>
<path class="dg-a" d="M210 68 H250"/>
<rect class="dg-ext" x="250" y="112" width="160" height="48"/><text class="dg-t" x="330" y="130" text-anchor="middle">Vision · Language</text><text class="dg-s" x="330" y="145" text-anchor="middle">· State</text>
<rect class="dg-box" x="460" y="112" width="140" height="48"/><text class="dg-t" x="530" y="130" text-anchor="middle">SmolVLA VLM</text><text class="dg-s" x="530" y="145" text-anchor="middle">0.45B</text>
<path class="dg-a" d="M410 136 H460"/>
<rect class="dg-key" x="650" y="60" width="170" height="100"/><text class="dg-t" x="735" y="94" text-anchor="middle">SA-RWFM</text><text class="dg-t" x="735" y="110" text-anchor="middle">action expert</text><text class="dg-s" x="735" y="130" text-anchor="middle">reward-weighted flow</text><text class="dg-s" x="735" y="144" text-anchor="middle">matching + anchor</text>
<path class="dg-a" d="M600 136 H625 V120 H650"/><path class="dg-ad" d="M410 68 H625 V88 H650"/><text class="dg-l" x="520" y="60" text-anchor="middle">reward as extra condition</text>
<rect class="dg-box" x="860" y="84" width="100" height="52"/><text class="dg-t" x="910" y="106" text-anchor="middle">Teacher</text><text class="dg-s" x="910" y="122" text-anchor="middle">π_T</text>
<path class="dg-a" d="M820 110 H860"/>
<rect class="dg-grp" x="10" y="196" width="960" height="194"/><text class="dg-h" x="22" y="214">STAGE 2 · TACTILE DISTILLATION (no tactile at inference)</text>
<rect class="dg-box" x="20" y="240" width="170" height="48"/><text class="dg-t" x="105" y="258" text-anchor="middle">Teacher targets â^T</text><text class="dg-s" x="105" y="273" text-anchor="middle">offline, N=51,251</text>
<path class="dg-a" d="M910 136 V226 H105 V240"/><text class="dg-l" x="560" y="220" text-anchor="middle">pre-computed once</text>
<rect class="dg-box" x="230" y="240" width="190" height="48"/><text class="dg-t" x="325" y="258" text-anchor="middle">ã = (1−α)a_GT + α â^T</text><text class="dg-s" x="325" y="273" text-anchor="middle">blend, α = 0.5</text>
<path class="dg-a" d="M190 264 H230"/>
<rect class="dg-ext" x="230" y="316" width="190" height="40"/><text class="dg-t" x="325" y="340" text-anchor="middle">Ground-truth actions a_GT</text>
<path class="dg-a" d="M325 316 V288"/>
<rect class="dg-key" x="470" y="228" width="210" height="76"/><text class="dg-t" x="575" y="254" text-anchor="middle">Student SmolVLA</text><text class="dg-s" x="575" y="272" text-anchor="middle">vision + state only; init from</text><text class="dg-s" x="575" y="286" text-anchor="middle">teacher, tactile encoder removed</text>
<path class="dg-a" d="M420 264 H470"/>
<rect class="dg-box" x="730" y="240" width="220" height="48"/><text class="dg-t" x="840" y="258" text-anchor="middle">Flow-matching L_distill</text><text class="dg-s" x="840" y="273" text-anchor="middle">target ã − x_0</text>
<path class="dg-a" d="M680 264 H730"/>
<rect class="dg-ext" x="470" y="330" width="480" height="40"/><text class="dg-t" x="710" y="348" text-anchor="middle">Inference: vision + state → predicted tactile token → actions</text><text class="dg-s" x="710" y="362" text-anchor="middle">(token output/size not specified in the paper)</text>
<path class="dg-ad" d="M575 304 V330"/>
</svg>
