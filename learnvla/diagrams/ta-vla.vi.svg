<path class="dg-a" d="M95 206 V230"/>
<rect class="dg-key" x="230" y="230" width="150" height="56"/><text class="dg-t" x="305" y="252" text-anchor="middle">MLP → 1 token</text><text class="dg-s" x="305" y="268" text-anchor="middle">token mô-men</text>
<path class="dg-a" d="M170 258 H230"/>
<rect class="dg-ext" x="230" y="316" width="150" height="48"/><text class="dg-t" x="305" y="338" text-anchor="middle">Token trạng thái q_t</text><text class="dg-s" x="305" y="354" text-anchor="middle">góc khớp</text>
<rect class="dg-ext" x="430" y="316" width="170" height="48"/><text class="dg-t" x="515" y="338" text-anchor="middle">Chunk nhiễu</text><text class="dg-s" x="515" y="354" text-anchor="middle">hành động + mô-men tương lai</text>
<rect class="dg-key" x="440" y="196" width="190" height="90"/><text class="dg-t" x="535" y="226" text-anchor="middle">Transformer</text><text class="dg-s" x="535" y="244" text-anchor="middle">token: mô-men, trạng thái,</text><text class="dg-s" x="535" y="260" text-anchor="middle">chunk nhiễu</text>
<path class="dg-a" d="M380 258 H440"/><path class="dg-a" d="M380 340 H410 V275 H440"/><path class="dg-a" d="M515 316 V286"/>
<path class="dg-ad" d="M320 82 V108 H535 V196"/><text class="dg-l" x="430" y="104">nhìn sang ảnh + chữ</text>
<rect class="dg-box" x="690" y="196" width="130" height="90"/><text class="dg-t" x="755" y="226" text-anchor="middle">Một lớp đầu ra</text><text class="dg-t" x="755" y="242" text-anchor="middle">tuyến tính</text><text class="dg-s" x="755" y="262" text-anchor="middle">hành động + mô-men</text>
<path class="dg-a" d="M630 241 H690"/>
<rect class="dg-box" x="860" y="166" width="100" height="44"/><text class="dg-t" x="910" y="186" text-anchor="middle">Hành động</text><text class="dg-s" x="910" y="201" text-anchor="middle">loss ×1</text>
<rect class="dg-box" x="860" y="256" width="100" height="44"/><text class="dg-t" x="910" y="276" text-anchor="middle">Mô-men (H=5)</text><text class="dg-s" x="910" y="291" text-anchor="middle">loss × β</text>
<path class="dg-a" d="M820 225 H840 V188 H860"/><path class="dg-a" d="M820 257 H840 V278 H860"/>
<text class="dg-note dg-red" x="440" y="402">✗ H token riêng (mỗi khung một token): làm nhiễu mẫu đầu vào của decoder</text>
