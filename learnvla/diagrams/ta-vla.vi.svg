<svg viewBox="0 0 980 412" xmlns="http://www.w3.org/2000/svg">
<rect class="dg-ext" x="20" y="30" width="150" height="48"/><text class="dg-t" x="95" y="52" text-anchor="middle">Ảnh + ngôn ngữ</text><text class="dg-s" x="95" y="68" text-anchor="middle">3 cameras</text>
<rect class="dg-box" x="230" y="26" width="180" height="56"/><text class="dg-t" x="320" y="50" text-anchor="middle">VLM (PaliGemma)</text><text class="dg-s" x="320" y="66" text-anchor="middle">encoder: giữ nguyên</text>
<path class="dg-a" d="M170 54 H230"/>
<text class="dg-note dg-red" x="440" y="58">✗ mô-men vào encoder: tệ hơn</text>
