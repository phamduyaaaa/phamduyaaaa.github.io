<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="22">SÁU DẠNG, TỪ GẦN CẢM BIẾN (TRÁI) TỚI GẦN Ý NGHĨA (PHẢI)</text>
<rect class="dg-box" x="20" y="48" width="140" height="120"/><text class="dg-t" x="90" y="72" text-anchor="middle">1 Token thô</text><text class="dg-s" x="90" y="94" text-anchor="middle">một lớp tuyến tính</text><text class="dg-s" x="90" y="118" text-anchor="middle">ForceVLA</text><text class="dg-s" x="90" y="134" text-anchor="middle">ForceVLA2</text>
<rect class="dg-box" x="180" y="48" width="140" height="120"/><text class="dg-t" x="250" y="72" text-anchor="middle">2 Lịch sử</text><text class="dg-s" x="250" y="94" text-anchor="middle">cửa sổ, GRU, bộ nhớ</text><text class="dg-s" x="250" y="118" text-anchor="middle">TORL-VLA</text><text class="dg-s" x="250" y="134" text-anchor="middle">FWBC-VLA</text><text class="dg-s" x="250" y="150" text-anchor="middle">FM-VLA</text>
<rect class="dg-box" x="340" y="48" width="140" height="120"/><text class="dg-t" x="410" y="72" text-anchor="middle">3 Có cấu trúc</text><text class="dg-s" x="410" y="94" text-anchor="middle">wrench, kẹp hay đẩy</text><text class="dg-s" x="410" y="118" text-anchor="middle">TER-DAgger</text><text class="dg-s" x="410" y="134" text-anchor="middle">Tabero</text>
<rect class="dg-key" x="500" y="48" width="140" height="120"/><text class="dg-t" x="570" y="72" text-anchor="middle">4 Căn chỉnh</text><text class="dg-s" x="570" y="94" text-anchor="middle">khớp với một</text><text class="dg-s" x="570" y="108" text-anchor="middle">phương thức khác</text><text class="dg-s" x="570" y="134" text-anchor="middle">TaF-VLA</text><text class="dg-s" x="570" y="150" text-anchor="middle">OmniVTLA</text>
<rect class="dg-box" x="660" y="48" width="140" height="120"/><text class="dg-t" x="730" y="72" text-anchor="middle">5 Ngôn ngữ</text><text class="dg-s" x="730" y="94" text-anchor="middle">một câu</text><text class="dg-s" x="730" y="118" text-anchor="middle">VLA-Touch</text><text class="dg-s" x="730" y="134" text-anchor="middle">VTLA</text>
<rect class="dg-box" x="820" y="48" width="140" height="120"/><text class="dg-t" x="890" y="72" text-anchor="middle">6 Dự đoán</text><text class="dg-s" x="890" y="94" text-anchor="middle">không cảm biến khi chạy</text><text class="dg-s" x="890" y="118" text-anchor="middle">FD-VLA</text><text class="dg-s" x="890" y="134" text-anchor="middle">HapticVLA</text>
<path class="dg-a" d="M20 214 H960"/><text class="dg-l" x="20" y="238">chi tiết hơn, nhanh hơn</text><text class="dg-l" x="960" y="238" text-anchor="end">nhiều ý nghĩa hơn, bền hơn</text>
<text class="dg-note dg-red" x="20" y="274">Cái giá khi sang phải: policy phụ thuộc nhiều hơn vào bộ mã hóa, mô hình ngôn ngữ hoặc tập huấn luyện.</text>
<text class="dg-note dg-green" x="20" y="298">Lợi ích: VLM dùng được tín hiệu mà không phải học từ vựng vật lý mới từ vài demo.</text>
