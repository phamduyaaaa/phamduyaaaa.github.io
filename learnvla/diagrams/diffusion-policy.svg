<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">TRAINING: ADD NOISE, PREDICT IT    SAMPLING: START FROM NOISE, REMOVE IT STEP BY STEP</text>
<rect class="dg-ext" x="20" y="50" width="160" height="56"/><text class="dg-t" x="100" y="74" text-anchor="middle">demo chunk a0</text><text class="dg-s" x="100" y="92" text-anchor="middle">T_p future actions</text>
<rect class="dg-box" x="220" y="50" width="190" height="56"/><text class="dg-t" x="315" y="74" text-anchor="middle">add noise, level k</text><text class="dg-s" x="315" y="92" text-anchor="middle">mix of a0 and noise eps</text>
<rect class="dg-key" x="450" y="50" width="190" height="56"/><text class="dg-t" x="545" y="74" text-anchor="middle">network eps_theta</text><text class="dg-s" x="545" y="92" text-anchor="middle">sees a_k, k, observation</text>
<rect class="dg-box" x="680" y="50" width="280" height="56"/><text class="dg-t" x="820" y="74" text-anchor="middle">loss = | eps_theta - eps |^2</text><text class="dg-s" x="820" y="92" text-anchor="middle">plain regression on the noise</text>
<path class="dg-a" d="M180 78 H220"/><path class="dg-a" d="M410 78 H450"/><path class="dg-a" d="M640 78 H680"/>
<rect class="dg-ext" x="20" y="170" width="160" height="56"/><text class="dg-t" x="100" y="194" text-anchor="middle">pure noise</text><text class="dg-s" x="100" y="212" text-anchor="middle">a_K ~ N(0, I)</text>
<rect class="dg-key" x="220" y="170" width="190" height="56"/><text class="dg-t" x="315" y="194" text-anchor="middle">denoise step</text><text class="dg-s" x="315" y="212" text-anchor="middle">remove predicted noise</text>
<rect class="dg-key" x="450" y="170" width="190" height="56"/><text class="dg-t" x="545" y="194" text-anchor="middle">... repeat</text><text class="dg-s" x="545" y="212" text-anchor="middle">100 in training, 10 with DDIM</text>
<rect class="dg-box" x="680" y="170" width="140" height="56"/><text class="dg-t" x="750" y="194" text-anchor="middle">action chunk</text><text class="dg-s" x="750" y="212" text-anchor="middle">T_p steps planned</text>
<rect class="dg-box" x="850" y="170" width="110" height="56"/><text class="dg-t" x="905" y="194" text-anchor="middle">run T_a</text><text class="dg-s" x="905" y="212" text-anchor="middle">then re-plan</text>
<path class="dg-a" d="M180 198 H220"/><path class="dg-a" d="M410 198 H450"/><path class="dg-a" d="M640 198 H680"/><path class="dg-a" d="M820 198 H850"/>
<text class="dg-l" x="20" y="270">different starting noise ends in different valid actions: the policy samples, it does not average</text>
</svg>
