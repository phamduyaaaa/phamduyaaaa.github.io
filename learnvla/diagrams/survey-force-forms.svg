<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="22">SIX FORMS, FROM CLOSE TO THE SENSOR (LEFT) TO CLOSE TO MEANING (RIGHT)</text>
<rect class="dg-box" x="20" y="48" width="140" height="120"/><text class="dg-t" x="90" y="72" text-anchor="middle">1 Raw token</text><text class="dg-s" x="90" y="94" text-anchor="middle">one linear layer</text><text class="dg-s" x="90" y="118" text-anchor="middle">ForceVLA</text><text class="dg-s" x="90" y="134" text-anchor="middle">ForceVLA2</text>
<rect class="dg-box" x="180" y="48" width="140" height="120"/><text class="dg-t" x="250" y="72" text-anchor="middle">2 History</text><text class="dg-s" x="250" y="94" text-anchor="middle">window, GRU, memory</text><text class="dg-s" x="250" y="118" text-anchor="middle">TORL-VLA</text><text class="dg-s" x="250" y="134" text-anchor="middle">FWBC-VLA</text><text class="dg-s" x="250" y="150" text-anchor="middle">FM-VLA</text>
<rect class="dg-box" x="340" y="48" width="140" height="120"/><text class="dg-t" x="410" y="72" text-anchor="middle">3 Structured</text><text class="dg-s" x="410" y="94" text-anchor="middle">wrench, grip vs push</text><text class="dg-s" x="410" y="118" text-anchor="middle">TER-DAgger</text><text class="dg-s" x="410" y="134" text-anchor="middle">Tabero</text>
<rect class="dg-key" x="500" y="48" width="140" height="120"/><text class="dg-t" x="570" y="72" text-anchor="middle">4 Aligned</text><text class="dg-s" x="570" y="94" text-anchor="middle">agrees with another</text><text class="dg-s" x="570" y="108" text-anchor="middle">modality</text><text class="dg-s" x="570" y="134" text-anchor="middle">TaF-VLA</text><text class="dg-s" x="570" y="150" text-anchor="middle">OmniVTLA</text>
<rect class="dg-box" x="660" y="48" width="140" height="120"/><text class="dg-t" x="730" y="72" text-anchor="middle">5 Language</text><text class="dg-s" x="730" y="94" text-anchor="middle">a sentence</text><text class="dg-s" x="730" y="118" text-anchor="middle">VLA-Touch</text><text class="dg-s" x="730" y="134" text-anchor="middle">VTLA</text>
<rect class="dg-box" x="820" y="48" width="140" height="120"/><text class="dg-t" x="890" y="72" text-anchor="middle">6 Predicted</text><text class="dg-s" x="890" y="94" text-anchor="middle">no sensor at run time</text><text class="dg-s" x="890" y="118" text-anchor="middle">FD-VLA</text><text class="dg-s" x="890" y="134" text-anchor="middle">HapticVLA</text>
<path class="dg-a" d="M20 214 H960"/><text class="dg-l" x="20" y="238">more detail, more speed</text><text class="dg-l" x="960" y="238" text-anchor="end">more meaning, more robustness</text>
<text class="dg-note dg-red" x="20" y="274">Cost of moving right: the policy depends more on the encoder, the language model or the training set.</text>
<text class="dg-note dg-green" x="20" y="298">Benefit: a VLM can use the signal without learning a new physical vocabulary from a few demos.</text>
</svg>
