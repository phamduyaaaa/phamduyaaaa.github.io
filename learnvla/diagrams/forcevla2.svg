<path class="dg-a" d="M340 56 H650 V166 H670"/><path class="dg-a" d="M630 225 H650 V196 H670"/>
<path class="dg-ad" d="M245 292 V340 H720 V210"/><text class="dg-l" x="480" y="334" text-anchor="middle">E_F bypass: raw force skips the fusion layers</text>
<rect class="dg-key" x="810" y="110" width="150" height="140"/><text class="dg-t" x="885" y="150" text-anchor="middle">Cross-Scale MoE</text><text class="dg-s" x="885" y="172" text-anchor="middle">3 experts: V · S · F</text><text class="dg-s" x="885" y="188" text-anchor="middle">token-wise gate w</text><text class="dg-s" x="885" y="204" text-anchor="middle">Σ w_m · Expert_m</text>
<path class="dg-a" d="M770 180 H810"/>
