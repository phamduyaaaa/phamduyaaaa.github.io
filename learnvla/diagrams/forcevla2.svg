<rect class="dg-ext" x="20" y="256" width="130" height="36"/><text class="dg-t" x="85" y="272" text-anchor="middle">F/T f_raw</text><text class="dg-s" x="85" y="285" text-anchor="middle">R^6</text>
<rect class="dg-box" x="190" y="212" width="110" height="36"/><text class="dg-t" x="245" y="234" text-anchor="middle">Linear φ_P</text>
<rect class="dg-box" x="190" y="256" width="110" height="36"/><text class="dg-t" x="245" y="278" text-anchor="middle">Linear φ_F</text>
<path class="dg-a" d="M150 230 H190"/><path class="dg-a" d="M150 274 H190"/>
<rect class="dg-box" x="340" y="234" width="100" height="36"/><text class="dg-t" x="390" y="250" text-anchor="middle">E_state</text><text class="dg-s" x="390" y="263" text-anchor="middle">[E_P ; E_F]</text>
<path class="dg-a" d="M300 230 H320 V246 H340"/><path class="dg-a" d="M300 274 H320 V258 H340"/>
<rect class="dg-box" x="480" y="190" width="150" height="70"/><text class="dg-t" x="555" y="218" text-anchor="middle">Cross-Attn</text><text class="dg-s" x="555" y="234" text-anchor="middle">Q = E_state</text><text class="dg-s" x="555" y="248" text-anchor="middle">K,V = E</text>
