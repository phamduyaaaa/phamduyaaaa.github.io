<path class="dg-a" d="M885 250 V290"/>
<rect class="dg-box" x="690" y="360" width="160" height="40"/><text class="dg-t" x="770" y="378" text-anchor="middle">a_t = [Δp_t ; f_t]</text><text class="dg-s" x="770" y="392" text-anchor="middle">hybrid pose + force</text>
