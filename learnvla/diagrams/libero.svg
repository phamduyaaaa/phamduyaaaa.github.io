<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">FOUR SUITES, EACH CHANGING ONE THING (10 TASKS x 50 HUMAN DEMOS EACH)</text>
<rect class="dg-box" x="20" y="44" width="220" height="96"/><text class="dg-t" x="130" y="70" text-anchor="middle">LIBERO-Spatial</text><text class="dg-s" x="130" y="92" text-anchor="middle">same objects, new layout</text><text class="dg-s" x="130" y="110" text-anchor="middle">two identical bowls:</text><text class="dg-s" x="130" y="126" text-anchor="middle">which one, by position</text>
<rect class="dg-box" x="260" y="44" width="220" height="96"/><text class="dg-t" x="370" y="70" text-anchor="middle">LIBERO-Object</text><text class="dg-s" x="370" y="92" text-anchor="middle">same layout, new objects</text><text class="dg-s" x="370" y="110" text-anchor="middle">pick-place a different</text><text class="dg-s" x="370" y="126" text-anchor="middle">object in each task</text>
<rect class="dg-box" x="500" y="44" width="220" height="96"/><text class="dg-t" x="610" y="70" text-anchor="middle">LIBERO-Goal</text><text class="dg-s" x="610" y="92" text-anchor="middle">same objects and layout</text><text class="dg-s" x="610" y="110" text-anchor="middle">different goal: the</text><text class="dg-s" x="610" y="126" text-anchor="middle">motion must change</text>
<rect class="dg-key" x="740" y="44" width="220" height="96"/><text class="dg-t" x="850" y="70" text-anchor="middle">LIBERO-Long (LIBERO-10)</text><text class="dg-s" x="850" y="92" text-anchor="middle">diverse objects, scenes</text><text class="dg-s" x="850" y="110" text-anchor="middle">long-horizon tasks,</text><text class="dg-s" x="850" y="126" text-anchor="middle">usually the lowest score</text>
<text class="dg-l" x="130" y="160" text-anchor="middle">declarative: where</text><text class="dg-l" x="370" y="160" text-anchor="middle">declarative: what</text><text class="dg-l" x="610" y="160" text-anchor="middle">procedural: how</text><text class="dg-l" x="850" y="160" text-anchor="middle">entangled</text>
<rect class="dg-ext" x="20" y="190" width="300" height="80"/><text class="dg-t" x="170" y="214" text-anchor="middle">fine-tune the VLA</text><text class="dg-s" x="170" y="234" text-anchor="middle">on one suite's demos</text><text class="dg-s" x="170" y="252" text-anchor="middle">(OpenVLA: one policy per suite)</text>
<rect class="dg-box" x="360" y="190" width="300" height="80"/><text class="dg-t" x="510" y="214" text-anchor="middle">roll out in simulation</text><text class="dg-s" x="510" y="234" text-anchor="middle">Franka Panda, fixed initial states</text><text class="dg-s" x="510" y="252" text-anchor="middle">n trials per task: 10 to 50</text>
<rect class="dg-key" x="700" y="190" width="260" height="80"/><text class="dg-t" x="830" y="214" text-anchor="middle">report</text><text class="dg-s" x="830" y="234" text-anchor="middle">success rate per suite</text><text class="dg-s" x="830" y="252" text-anchor="middle">+ the average of the four</text>
<path class="dg-a" d="M320 230 H360"/><path class="dg-a" d="M660 230 H700"/>
</svg>
