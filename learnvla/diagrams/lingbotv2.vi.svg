<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">LINGBOT-VLA 2.0: NHIỀU DỮ LIỆU HƠN, NHIỀU BẬC TỰ DO HƠN, VÀ DỰ ĐOÁN TƯƠNG LAI</text>
<rect class="dg-ext" x="20" y="44" width="220" height="100"/><text class="dg-t" x="130" y="68" text-anchor="middle">~60.000 giờ tiền huấn luyện</text><text class="dg-s" x="130" y="90" text-anchor="middle">50.000 giờ dữ liệu robot,</text><text class="dg-s" x="130" y="106" text-anchor="middle">20 cấu hình robot</text><text class="dg-s" x="130" y="122" text-anchor="middle">+ 10.000 giờ video người</text>
<rect class="dg-box" x="20" y="160" width="220" height="100"/><text class="dg-t" x="130" y="184" text-anchor="middle">quy trình dữ liệu</text><text class="dg-s" x="130" y="206" text-anchor="middle">VLM chia video thành tác vụ con;</text><text class="dg-s" x="130" y="222" text-anchor="middle">bàn tay người dựng lại 3D</text><text class="dg-s" x="130" y="238" text-anchor="middle">qua SLAM + tư thế tay (MANO)</text>
<rect class="dg-key" x="290" y="44" width="230" height="216"/><text class="dg-t" x="405" y="72" text-anchor="middle">VLM backbone</text><text class="dg-s" x="405" y="94" text-anchor="middle">ảnh + câu lệnh</text><text class="dg-s" x="405" y="126" text-anchor="middle">+ hai query học được:</text><text class="dg-s" x="405" y="142" text-anchor="middle">Q_t (hiện tại), Q_t+T (tương lai)</text><text class="dg-s" x="405" y="176" text-anchor="middle">chưng cất từ các thầy:</text><text class="dg-s" x="405" y="192" text-anchor="middle">LingBot-Depth (hình học)</text><text class="dg-s" x="405" y="208" text-anchor="middle">DINO-Video (thời gian)</text>
<rect class="dg-key" x="570" y="44" width="200" height="216"/><text class="dg-t" x="670" y="72" text-anchor="middle">action expert</text><text class="dg-s" x="670" y="94" text-anchor="middle">MoE thưa theo token</text><text class="dg-s" x="670" y="110" text-anchor="middle">trong các lớp FFN</text><text class="dg-s" x="670" y="142" text-anchor="middle">cân bằng tải không loss:</text><text class="dg-s" x="670" y="158" text-anchor="middle">bias của router, không</text><text class="dg-s" x="670" y="174" text-anchor="middle">cần loss cân bằng</text>
<rect class="dg-box" x="810" y="44" width="150" height="216"/><text class="dg-t" x="885" y="72" text-anchor="middle">không gian hành động</text><text class="dg-s" x="885" y="94" text-anchor="middle">hai tay +</text><text class="dg-s" x="885" y="110" text-anchor="middle">đầu, eo,</text><text class="dg-s" x="885" y="126" text-anchor="middle">đế di động,</text><text class="dg-s" x="885" y="142" text-anchor="middle">bàn tay khéo</text>
<path class="dg-a" d="M240 94 H290"/><path class="dg-a" d="M240 210 H290"/><path class="dg-a" d="M520 152 H570"/><path class="dg-a" d="M770 152 H810"/>
<text class="dg-l" x="20" y="296">query tương lai được học để khớp đặc trưng của các thầy ở khung sau một chunk</text>
</svg>
