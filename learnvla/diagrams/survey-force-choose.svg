<svg viewBox="0 0 980 400" xmlns="http://www.w3.org/2000/svg">
<rect class="dg-key" x="20" y="20" width="200" height="50"/><text class="dg-t" x="120" y="50" text-anchor="middle">Start: my task</text>
<rect class="dg-box" x="300" y="14" width="260" height="62"/><text class="dg-t" x="430" y="40" text-anchor="middle">Is the robot's job about</text><text class="dg-t" x="430" y="56" text-anchor="middle">HOW HARD to push?</text>
<path class="dg-a" d="M220 45 H300"/>
<rect class="dg-box" x="680" y="14" width="280" height="62"/><text class="dg-t" x="820" y="40" text-anchor="middle">Output a force target</text><text class="dg-t" x="820" y="56" text-anchor="middle">or a stiffness (Survey 3)</text>
<path class="dg-a" d="M560 45 H680"/><text class="dg-l" x="600" y="38">yes</text>
<rect class="dg-box" x="300" y="116" width="260" height="62"/><text class="dg-t" x="430" y="142" text-anchor="middle">Does contact change in</text><text class="dg-t" x="430" y="158" text-anchor="middle">tens of milliseconds?</text>
<path class="dg-a" d="M430 76 V116"/><text class="dg-l" x="440" y="100">no</text>
<rect class="dg-box" x="680" y="116" width="280" height="62"/><text class="dg-t" x="820" y="142" text-anchor="middle">Add a fast residual or</text><text class="dg-t" x="820" y="158" text-anchor="middle">controller outside the VLA</text>
<path class="dg-a" d="M560 147 H680"/><text class="dg-l" x="600" y="140">yes</text>
<rect class="dg-box" x="300" y="218" width="260" height="62"/><text class="dg-t" x="430" y="244" text-anchor="middle">Will the deployed robot</text><text class="dg-t" x="430" y="260" text-anchor="middle">have the force sensor?</text>
<path class="dg-a" d="M430 178 V218"/><text class="dg-l" x="440" y="202">no</text>
<rect class="dg-box" x="680" y="218" width="280" height="62"/><text class="dg-t" x="820" y="244" text-anchor="middle">Distil from a sensorised teacher,</text><text class="dg-t" x="820" y="260" text-anchor="middle">or estimate from joint torque</text>
<path class="dg-a" d="M560 249 H680"/><text class="dg-l" x="600" y="242">no</text>
<rect class="dg-key" x="300" y="320" width="260" height="62"/><text class="dg-t" x="430" y="346" text-anchor="middle">Fuse after the VLM with a</text><text class="dg-t" x="430" y="362" text-anchor="middle">protected path (e.g. MoE)</text>
<path class="dg-a" d="M430 280 V320"/><text class="dg-l" x="440" y="304">yes</text>
<rect class="dg-grp" x="680" y="320" width="280" height="62"/><text class="dg-t" x="820" y="346" text-anchor="middle">Same contact keeps failing?</text><text class="dg-s" x="820" y="364" text-anchor="middle">add human corrections, refine online</text>
<path class="dg-ad" d="M560 351 H680"/>
</svg>
