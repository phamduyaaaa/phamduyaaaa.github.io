<svg viewBox="0 0 980 400" xmlns="http://www.w3.org/2000/svg">
<rect class="dg-key" x="20" y="20" width="200" height="50"/><text class="dg-t" x="120" y="50" text-anchor="middle">Bắt đầu: tác vụ của tôi</text>
<rect class="dg-box" x="300" y="14" width="260" height="62"/><text class="dg-t" x="430" y="40" text-anchor="middle">Việc của robot có phải là</text><text class="dg-t" x="430" y="56" text-anchor="middle">ẤN MẠNH CỠ NÀO?</text>
<path class="dg-a" d="M220 45 H300"/>
<rect class="dg-box" x="680" y="14" width="280" height="62"/><text class="dg-t" x="820" y="40" text-anchor="middle">Xuất đích lực</text><text class="dg-t" x="820" y="56" text-anchor="middle">hoặc độ cứng (Survey 3)</text>
<path class="dg-a" d="M560 45 H680"/><text class="dg-l" x="600" y="38">có</text>
<rect class="dg-box" x="300" y="116" width="260" height="62"/><text class="dg-t" x="430" y="142" text-anchor="middle">Tiếp xúc có đổi trong</text><text class="dg-t" x="430" y="158" text-anchor="middle">vài chục mili giây?</text>
<path class="dg-a" d="M430 76 V116"/><text class="dg-l" x="440" y="100">không</text>
<rect class="dg-box" x="680" y="116" width="280" height="62"/><text class="dg-t" x="820" y="142" text-anchor="middle">Thêm residual nhanh hoặc</text><text class="dg-t" x="820" y="158" text-anchor="middle">bộ điều khiển ngoài VLA</text>
<path class="dg-a" d="M560 147 H680"/><text class="dg-l" x="600" y="140">có</text>
<rect class="dg-box" x="300" y="218" width="260" height="62"/><text class="dg-t" x="430" y="244" text-anchor="middle">Robot khi triển khai</text><text class="dg-t" x="430" y="260" text-anchor="middle">có cảm biến lực không?</text>
<path class="dg-a" d="M430 178 V218"/><text class="dg-l" x="440" y="202">không</text>
<rect class="dg-box" x="680" y="218" width="280" height="62"/><text class="dg-t" x="820" y="244" text-anchor="middle">Chưng cất từ thầy có cảm biến,</text><text class="dg-t" x="820" y="260" text-anchor="middle">hoặc ước lượng từ mô-men khớp</text>
<path class="dg-a" d="M560 249 H680"/><text class="dg-l" x="600" y="242">không</text>
<rect class="dg-key" x="300" y="320" width="260" height="62"/><text class="dg-t" x="430" y="346" text-anchor="middle">Hợp nhất sau VLM với một</text><text class="dg-t" x="430" y="362" text-anchor="middle">đường riêng được bảo vệ (vd. MoE)</text>
<path class="dg-a" d="M430 280 V320"/><text class="dg-l" x="440" y="304">có</text>
<rect class="dg-grp" x="680" y="320" width="280" height="62"/><text class="dg-t" x="820" y="346" text-anchor="middle">Cùng một tiếp xúc cứ hỏng?</text><text class="dg-s" x="820" y="364" text-anchor="middle">thêm sửa của người, tinh chỉnh online</text>
<path class="dg-ad" d="M560 351 H680"/>
</svg>
