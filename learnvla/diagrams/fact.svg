<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="26">ONE CHUNK: PLAN WITH VIDEO AND TRACKS, THEN REFINE ACTION TOGETHER WITH FORCE</text>
<rect class="dg-ext" x="20" y="46" width="190" height="54"/><text class="dg-t" x="115" y="68" text-anchor="middle">views + instruction</text><text class="dg-s" x="115" y="86" text-anchor="middle">ego and wrist cameras</text>
<rect class="dg-ext" x="20" y="112" width="190" height="54"/><text class="dg-t" x="115" y="134" text-anchor="middle">robot state + past tracks</text><text class="dg-s" x="115" y="152" text-anchor="middle">visual track history</text>
<rect class="dg-key" x="20" y="178" width="190" height="54"/><text class="dg-t" x="115" y="200" text-anchor="middle">tactile history</text><text class="dg-s" x="115" y="218" text-anchor="middle">fingertip force, 5 Hz</text>
<rect class="dg-box" x="250" y="46" width="220" height="140"/><text class="dg-t" x="360" y="78" text-anchor="middle">Track-Guided</text><text class="dg-t" x="360" y="96" text-anchor="middle">Coarse Planner</text><text class="dg-s" x="360" y="120" text-anchor="middle">5B video DiT</text><text class="dg-s" x="360" y="138" text-anchor="middle">denoises future video,</text><text class="dg-s" x="360" y="154" text-anchor="middle">visual tracks, coarse action</text>
<rect class="dg-key" x="580" y="46" width="200" height="140"/><text class="dg-t" x="680" y="78" text-anchor="middle">Force-Action</text><text class="dg-t" x="680" y="96" text-anchor="middle">Joint Refiner</text><text class="dg-s" x="680" y="120" text-anchor="middle">6-block transformer, 65M</text><text class="dg-s" x="680" y="138" text-anchor="middle">co-denoises action suffix</text><text class="dg-s" x="680" y="154" text-anchor="middle">and future fingertip force</text>
<path class="dg-a" d="M210 73 H250"/><path class="dg-a" d="M210 139 H250"/>
<path class="dg-a" d="M470 90 H580"/><text class="dg-s" x="476" y="82">handoff, tau 0.4</text>
<path class="dg-ad" d="M470 150 H580"/><text class="dg-s" x="476" y="142">cached states</text>
<path class="dg-a" d="M210 205 H680 V186"/>
<rect class="dg-box" x="830" y="46" width="130" height="54"/><text class="dg-t" x="895" y="68" text-anchor="middle">action chunk</text><text class="dg-s" x="895" y="86" text-anchor="middle">16 steps, 20 Hz</text>
<rect class="dg-ext" x="830" y="112" width="130" height="54"/><text class="dg-t" x="895" y="134" text-anchor="middle">future force</text><text class="dg-s" x="895" y="152" text-anchor="middle">predicted only</text>
<rect class="dg-grp" x="830" y="178" width="130" height="54"/><text class="dg-t" x="895" y="200" text-anchor="middle">video + tracks</text><text class="dg-s" x="895" y="218" text-anchor="middle">decoded, not run</text>
<path class="dg-a" d="M780 73 H830"/><path class="dg-a" d="M780 139 H830"/><path class="dg-a" d="M795 139 V205 H830"/>
<text class="dg-l" x="250" y="258">every 5 Hz tactile refresh, only the refiner re-runs on the unexecuted part of the chunk</text>
<text class="dg-h" x="20" y="300">PRETRAINING</text>
<rect class="dg-ext" x="20" y="316" width="300" height="56"/><text class="dg-t" x="170" y="340" text-anchor="middle">EgoForce: 2,000 h of humans</text><text class="dg-s" x="170" y="358" text-anchor="middle">tactile gloves + 3 egocentric cameras</text>
<rect class="dg-ext" x="350" y="316" width="260" height="56"/><text class="dg-t" x="480" y="340" text-anchor="middle">+ 100 h robot teleoperation</text><text class="dg-s" x="480" y="358" text-anchor="middle">from the T-Rex data</text>
<rect class="dg-key" x="640" y="316" width="320" height="56"/><text class="dg-t" x="800" y="340" text-anchor="middle">trained end to end, from the video DiT</text><text class="dg-s" x="800" y="358" text-anchor="middle">240 accelerators</text>
<path class="dg-a" d="M320 344 H350"/><path class="dg-a" d="M610 344 H640"/>
<rect class="dg-box" x="20" y="394" width="940" height="34"/><text class="dg-t" x="490" y="416" text-anchor="middle">fine-tune per task: 10 robot + 90 human trajectories, 8 GPUs</text>
</svg>
