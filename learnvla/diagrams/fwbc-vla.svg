<svg viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg">
<rect class="dg-ext" x="20" y="52" width="150" height="52"/><text class="dg-t" x="95" y="72" text-anchor="middle">Joint torque τ_meas</text><text class="dg-s" x="95" y="88" text-anchor="middle">+ arm/base/leg/IMU</text>
<rect class="dg-key" x="210" y="40" width="170" height="76"/><text class="dg-t" x="295" y="66" text-anchor="middle">HSR-Force</text><text class="dg-s" x="295" y="84" text-anchor="middle">history expert + state</text><text class="dg-s" x="295" y="98" text-anchor="middle">expert, gate α_t</text>
<path class="dg-a" d="M170 78 H210"/><text class="dg-l" x="295" y="32" text-anchor="middle">200 Hz, sensorless</text>
<rect class="dg-box" x="420" y="58" width="100" height="40"/><text class="dg-t" x="470" y="76" text-anchor="middle">τ̂_ext</text><text class="dg-s" x="470" y="90" text-anchor="middle">residual</text>
<path class="dg-a" d="M380 78 H420"/>
<rect class="dg-box" x="560" y="20" width="160" height="52"/><text class="dg-t" x="640" y="40" text-anchor="middle">d = [‖τ̂‖, Δ‖τ̂‖]</text><text class="dg-s" x="640" y="56" text-anchor="middle">K=13 steps → GRU E_int</text>
<rect class="dg-box" x="560" y="100" width="160" height="52"/><text class="dg-t" x="640" y="120" text-anchor="middle">Jacobian wrench</text><text class="dg-s" x="640" y="136" text-anchor="middle">→ body-frame F̂_body</text>
<path class="dg-a" d="M520 70 H540 V46 H560"/><path class="dg-a" d="M520 86 H540 V126 H560"/>
<rect class="dg-key" x="770" y="30" width="190" height="92"/><text class="dg-t" x="865" y="58" text-anchor="middle">π0.5 VLA · 15 Hz</text><text class="dg-s" x="865" y="78" text-anchor="middle">action expert + cross-attn</text><text class="dg-s" x="865" y="92" text-anchor="middle">to force tokens Z_force</text><text class="dg-s" x="865" y="108" text-anchor="middle">(gate g_t, scale α_f)</text>
<path class="dg-a" d="M720 46 H770"/><text class="dg-l" x="745" y="38" text-anchor="middle">tokens</text>
<rect class="dg-ext" x="790" y="150" width="150" height="30"/><text class="dg-t" x="865" y="170" text-anchor="middle">images + language</text>
<path class="dg-a" d="M865 150 V122"/>
<rect class="dg-ext" x="420" y="210" width="130" height="36"/><text class="dg-t" x="485" y="232" text-anchor="middle">IMU Δη, ω</text>
<rect class="dg-key" x="590" y="196" width="190" height="64"/><text class="dg-t" x="685" y="222" text-anchor="middle">Compensation C_ψ</text><text class="dg-s" x="685" y="240" text-anchor="middle">MLP → r̄ = (Δv_x,Δv_y,Δω_z)</text>
<path class="dg-a" d="M640 152 V196"/><path class="dg-a" d="M550 228 H590"/>
<circle class="dg-box" cx="865" cy="296" r="14"/><text class="dg-t" x="865" y="301" text-anchor="middle">+</text>
<path class="dg-a" d="M780 240 H830 V296 H851"/><text class="dg-l" x="700" y="282" text-anchor="middle">r = r_max·tanh(r̄)</text>
<path class="dg-a" d="M960 76 H972 V296 H879"/><text class="dg-l" x="968" y="230" text-anchor="end">u_nom (nominal base)</text>
<rect class="dg-key" x="770" y="340" width="190" height="52"/><text class="dg-t" x="865" y="362" text-anchor="middle">WBC policy</text><text class="dg-s" x="865" y="378" text-anchor="middle">balance + command tracking</text>
<path class="dg-a" d="M865 310 V340"/><text class="dg-l" x="855" y="328" text-anchor="end">u_base = u_nom + r</text>
<rect class="dg-ext" x="560" y="346" width="170" height="40"/><text class="dg-t" x="645" y="364" text-anchor="middle">Wheeled-legged robot</text><text class="dg-s" x="645" y="378" text-anchor="middle">+ 6-DoF arm</text>
<path class="dg-a" d="M770 366 H730"/>
<text class="dg-h" x="20" y="416">arm and gripper actions go from the VLA to the WBC unchanged; only the base command is corrected.</text>
</svg>
