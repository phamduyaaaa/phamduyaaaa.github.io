<svg viewBox="0 0 980 310" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">FROM BIASED TASK LISTS TO 100 LONG-TAIL TASKS, SCORED ON REAL ROBOTS</text>
<rect class="dg-badbox" x="20" y="44" width="220" height="80"/><text class="dg-t" x="130" y="68" text-anchor="middle">existing task lists</text><text class="dg-s" x="130" y="88" text-anchor="middle">OXE, Agibot, ...: most verbs</text><text class="dg-s" x="130" y="104" text-anchor="middle">are "pick and hold"</text>
<rect class="dg-box" x="280" y="44" width="220" height="80"/><text class="dg-t" x="390" y="68" text-anchor="middle">expand by primitives</text><text class="dg-s" x="390" y="88" text-anchor="middle">human-object interaction</text><text class="dg-s" x="390" y="104" text-anchor="middle">+ object affordances</text>
<rect class="dg-key" x="540" y="44" width="200" height="80"/><text class="dg-t" x="640" y="68" text-anchor="middle">GM-100</text><text class="dg-s" x="640" y="88" text-anchor="middle">100 tasks, each with</text><text class="dg-s" x="640" y="104" text-anchor="middle">criteria + template video</text>
<rect class="dg-ext" x="780" y="44" width="180" height="80"/><text class="dg-t" x="870" y="68" text-anchor="middle">13K+ teleop</text><text class="dg-s" x="870" y="88" text-anchor="middle">trajectories,</text><text class="dg-s" x="870" y="104" text-anchor="middle">open-sourced</text>
<path class="dg-a" d="M240 84 H280"/><path class="dg-a" d="M500 84 H540"/><path class="dg-a" d="M740 84 H780"/>
<rect class="dg-box" x="20" y="170" width="280" height="80"/><text class="dg-t" x="160" y="194" text-anchor="middle">Agilex Cobot Magic</text><text class="dg-s" x="160" y="214" text-anchor="middle">Mobile-Aloha-like, head camera</text><text class="dg-s" x="160" y="230" text-anchor="middle">all 100 tasks</text>
<rect class="dg-box" x="330" y="170" width="280" height="80"/><text class="dg-t" x="470" y="194" text-anchor="middle">Dobot Xtrainer</text><text class="dg-s" x="470" y="214" text-anchor="middle">Aloha-like, top-down camera</text><text class="dg-s" x="470" y="230" text-anchor="middle">tasks 1-10: 100 train + 30 test</text>
<rect class="dg-key" x="640" y="160" width="320" height="100"/><text class="dg-t" x="800" y="184" text-anchor="middle">three scores per task</text><text class="dg-s" x="800" y="204" text-anchor="middle">SR: whole task done</text><text class="dg-s" x="800" y="220" text-anchor="middle">PSR: share of sub-tasks done</text><text class="dg-s" x="800" y="236" text-anchor="middle">action error on 30 held-out demos</text>
<path class="dg-a" d="M870 124 V142 H160 V170"/><path class="dg-a" d="M470 142 V170"/><path class="dg-a" d="M610 210 H640"/>
<text class="dg-l" x="20" y="290">tasks are chosen by physical common sense and how-level affordance, not by how useful they are in a home</text>
</svg>
