<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">RT-1 (12/2022): TRANSFORMER ROBOT NHỎ HỌC TỪ DỮ LIỆU ROBOT</text>
<rect class="dg-ext" x="20" y="40" width="160" height="70"/><text class="dg-t" x="100" y="64" text-anchor="middle">6 ảnh</text><text class="dg-s" x="100" y="84" text-anchor="middle">lịch sử 300x300</text><text class="dg-s" x="100" y="100" text-anchor="middle">+ câu lệnh (USE)</text>
<rect class="dg-box" x="210" y="40" width="170" height="70"/><text class="dg-t" x="295" y="64" text-anchor="middle">FiLM EfficientNet</text><text class="dg-s" x="295" y="84" text-anchor="middle">chữ điều khiển phần ảnh</text><text class="dg-s" x="295" y="100" text-anchor="middle">81 token / ảnh</text>
<rect class="dg-key" x="410" y="40" width="150" height="70"/><text class="dg-t" x="485" y="64" text-anchor="middle">TokenLearner</text><text class="dg-s" x="485" y="84" text-anchor="middle">81 → 8 token</text><text class="dg-s" x="485" y="100" text-anchor="middle">mỗi ảnh</text>
<rect class="dg-box" x="590" y="40" width="170" height="70"/><text class="dg-t" x="675" y="64" text-anchor="middle">Transformer</text><text class="dg-s" x="675" y="84" text-anchor="middle">8 lớp, 19M</text><text class="dg-s" x="675" y="100" text-anchor="middle">tổng 35M</text>
<rect class="dg-box" x="790" y="40" width="170" height="70"/><text class="dg-t" x="875" y="64" text-anchor="middle">11 token hành động</text><text class="dg-s" x="875" y="84" text-anchor="middle">mỗi token 256 bin</text><text class="dg-s" x="875" y="100" text-anchor="middle">tay 7, đế 3, chế độ 1</text>
<path class="dg-a" d="M180 75 H210"/><path class="dg-a" d="M380 75 H410"/><path class="dg-a" d="M560 75 H590"/><path class="dg-a" d="M760 75 H790"/>
<text class="dg-s" x="20" y="134">dữ liệu: ~130k demo, 700+ câu lệnh, 13 robot trong 17 tháng; chạy 3 Hz trên robot</text>
<text class="dg-h" x="20" y="174">RT-2 (07/2023): FINE-TUNE VLM CỠ WEB ĐỂ HÀNH ĐỘNG CHỈ LÀ THÊM CHỮ</text>
<rect class="dg-ext" x="20" y="190" width="200" height="74"/><text class="dg-t" x="120" y="214" text-anchor="middle">ảnh + câu hỏi</text><text class="dg-s" x="120" y="234" text-anchor="middle">"robot nên làm hành</text><text class="dg-s" x="120" y="250" text-anchor="middle">động gì để ...?"</text>
<rect class="dg-key" x="250" y="190" width="240" height="74"/><text class="dg-t" x="370" y="214" text-anchor="middle">VLM, co-fine-tune</text><text class="dg-s" x="370" y="234" text-anchor="middle">PaLI-X 5B / 55B hoặc PaLM-E 12B</text><text class="dg-s" x="370" y="250" text-anchor="middle">dữ liệu robot + VQA web</text>
<rect class="dg-box" x="520" y="190" width="220" height="74"/><text class="dg-t" x="630" y="214" text-anchor="middle">câu trả lời chữ</text><text class="dg-s" x="630" y="234" text-anchor="middle">"1 128 91 241 5 101 127"</text><text class="dg-s" x="630" y="250" text-anchor="middle">kết thúc, 6 delta, tay kẹp</text>
<rect class="dg-box" x="770" y="190" width="190" height="74"/><text class="dg-t" x="865" y="214" text-anchor="middle">giải token</text><text class="dg-s" x="865" y="234" text-anchor="middle">bin → hành động</text><text class="dg-s" x="865" y="250" text-anchor="middle">55B: 1-3 Hz (TPU đám mây)</text>
<path class="dg-a" d="M220 227 H250"/><path class="dg-a" d="M490 227 H520"/><path class="dg-a" d="M740 227 H770"/>
<text class="dg-l" x="20" y="300">bước từ RT-1 lên RT-2 là backbone: tri thức web vào qua VLM tiền huấn luyện, định dạng hành động vẫn là token chia bin</text>
</svg>
