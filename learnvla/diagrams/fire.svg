<svg viewBox="0 0 980 444" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="26">ONE CONTROL STEP: THE VLA PLANS, THE RESIDUAL NEGOTIATES THE CONTACT</text>
<rect class="dg-ext" x="20" y="46" width="200" height="64"/><text class="dg-t" x="120" y="70" text-anchor="middle">3 cameras + abs. pose + text</text><text class="dg-s" x="120" y="90" text-anchor="middle">no force; read once per chunk</text>
<rect class="dg-key" x="260" y="46" width="170" height="64"/><text class="dg-t" x="345" y="70" text-anchor="middle">Frozen VLA</text><text class="dg-s" x="345" y="90" text-anchor="middle">only its action head tuned</text>
<rect class="dg-box" x="470" y="46" width="150" height="64"/><text class="dg-t" x="545" y="70" text-anchor="middle">Chunk a_VLA</text><text class="dg-s" x="545" y="90" text-anchor="middle">T = 16 steps (GR00T)</text>
<path class="dg-a" d="M220 78 H260"/><path class="dg-a" d="M430 78 H470"/>
<rect class="dg-ext" x="20" y="170" width="200" height="70"/><text class="dg-t" x="120" y="194" text-anchor="middle">rel. pose, velocity,</text><text class="dg-t" x="120" y="210" text-anchor="middle">force F (3), last a</text><text class="dg-s" x="120" y="228" text-anchor="middle">every step, 15 Hz</text>
<rect class="dg-key" x="260" y="170" width="170" height="70"/><text class="dg-t" x="345" y="196" text-anchor="middle">Residual policy</text><text class="dg-s" x="345" y="214" text-anchor="middle">PPO, trained in sim</text>
<rect class="dg-box" x="470" y="170" width="150" height="70"/><text class="dg-t" x="545" y="196" text-anchor="middle">a_res</text><text class="dg-s" x="545" y="214" text-anchor="middle">bounded, 6-D</text>
<path class="dg-a" d="M220 205 H260"/><path class="dg-a" d="M430 205 H470"/>
<circle class="dg-key" cx="700" cy="141" r="22"/><text class="dg-t" x="700" y="148" text-anchor="middle">+</text>
<path class="dg-a" d="M620 78 H700 V119"/><path class="dg-a" d="M620 205 H700 V163"/>
<rect class="dg-box" x="770" y="116" width="190" height="50"/><text class="dg-t" x="865" y="138" text-anchor="middle">Impedance controller</text><text class="dg-s" x="865" y="154" text-anchor="middle">1 kHz, interpolates</text>
<path class="dg-a" d="M722 141 H770"/>
<rect class="dg-ext" x="770" y="200" width="190" height="50"/><text class="dg-t" x="865" y="222" text-anchor="middle">Franka FR3</text><text class="dg-s" x="865" y="238" text-anchor="middle">wrist 3-axis force sensor</text>
<path class="dg-a" d="M865 166 V200"/>
<path class="dg-ad" d="M865 250 V275 H120 V240"/><text class="dg-l" x="400" y="270">force, pose and velocity feed back at every step</text>
<text class="dg-h" x="20" y="318">SLOW-FAST LOOP: THE NEXT CHUNK IS FETCHED WHILE THE CURRENT ONE RUNS</text>
<rect class="dg-box" x="20" y="334" width="440" height="30"/><text class="dg-t" x="240" y="354" text-anchor="middle">chunk i is executing</text>
<rect class="dg-grp" x="460" y="334" width="440" height="30"/><text class="dg-t" x="680" y="354" text-anchor="middle">chunk i+1 (swapped in when i ends)</text>
<path class="dg-ad" d="M240 364 V382"/><text class="dg-s" x="250" y="394">midpoint: prefetch next chunk</text>
<path class="dg-ad" d="M460 364 V404"/><text class="dg-s" x="470" y="416">end of chunk: swap in the prefetched one</text>
<text class="dg-l" x="20" y="430">the residual keeps correcting every step, so the loop never waits for the VLA</text>
</svg>
