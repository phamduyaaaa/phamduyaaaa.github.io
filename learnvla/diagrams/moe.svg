<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">A SPARSE MoE LAYER: A ROUTER SENDS EACH TOKEN TO ONE (OR k) OF N EXPERTS</text>
<rect class="dg-ext" x="20" y="120" width="140" height="56"/><text class="dg-t" x="90" y="144" text-anchor="middle">token x</text><text class="dg-s" x="90" y="162" text-anchor="middle">e.g. a force token</text>
<rect class="dg-key" x="210" y="120" width="150" height="56"/><text class="dg-t" x="285" y="144" text-anchor="middle">router</text><text class="dg-s" x="285" y="162" text-anchor="middle">softmax(W_r x)</text>
<path class="dg-a" d="M160 148 H210"/>
<rect class="dg-key" x="440" y="44" width="150" height="44"/><text class="dg-t" x="515" y="64" text-anchor="middle">expert 1</text><text class="dg-s" x="515" y="80" text-anchor="middle">p = 0.70, chosen</text>
<rect class="dg-box" x="440" y="100" width="150" height="44"/><text class="dg-t" x="515" y="120" text-anchor="middle">expert 2</text><text class="dg-s" x="515" y="136" text-anchor="middle">p = 0.16, skipped</text>
<rect class="dg-box" x="440" y="156" width="150" height="44"/><text class="dg-t" x="515" y="176" text-anchor="middle">expert 3</text><text class="dg-s" x="515" y="192" text-anchor="middle">p = 0.11, skipped</text>
<rect class="dg-box" x="440" y="212" width="150" height="44"/><text class="dg-t" x="515" y="232" text-anchor="middle">expert 4</text><text class="dg-s" x="515" y="248" text-anchor="middle">p = 0.04, skipped</text>
<path class="dg-a" d="M360 140 H400 V66 H440"/><path class="dg-ad" d="M400 122 H440"/><path class="dg-ad" d="M400 140 V178 H440"/><path class="dg-ad" d="M400 178 V234 H440"/>
<rect class="dg-box" x="660" y="44" width="150" height="56"/><text class="dg-t" x="735" y="68" text-anchor="middle">p x E1(x)</text><text class="dg-s" x="735" y="86" text-anchor="middle">gate times output</text>
<path class="dg-a" d="M590 66 H660"/>
<rect class="dg-box" x="840" y="44" width="120" height="56"/><text class="dg-t" x="900" y="68" text-anchor="middle">x + ...</text><text class="dg-s" x="900" y="86" text-anchor="middle">residual</text>
<path class="dg-a" d="M810 72 H840"/>
<text class="dg-l" x="640" y="160">capacity: 4 experts of parameters</text>
<text class="dg-l" x="640" y="182">compute: 1 expert per token</text>
<text class="dg-note dg-red" x="640" y="230">without a balancing loss, one expert</text><text class="dg-note dg-red" x="640" y="248">can end up taking every token</text>
</svg>
