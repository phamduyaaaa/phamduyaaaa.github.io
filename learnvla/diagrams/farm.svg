<svg viewBox="0 0 980 400" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="26">DEMONSTRATION: HAND-HELD UMI WITH A GELSIGHT FINGER</text>
<rect class="dg-ext" x="20" y="46" width="220" height="54"/><text class="dg-t" x="130" y="68" text-anchor="middle">hand-held UMI gripper</text><text class="dg-s" x="130" y="86" text-anchor="middle">the human applies the force</text>
<rect class="dg-ext" x="290" y="46" width="200" height="54"/><text class="dg-t" x="390" y="68" text-anchor="middle">GelSight Mini</text><text class="dg-s" x="390" y="86" text-anchor="middle">320x240, 25 Hz</text>
<rect class="dg-key" x="540" y="46" width="200" height="54"/><text class="dg-t" x="640" y="68" text-anchor="middle">FEATS (frozen)</text><text class="dg-s" x="640" y="86" text-anchor="middle">shear x, shear y, normal</text>
<rect class="dg-box" x="790" y="46" width="170" height="54"/><text class="dg-t" x="875" y="68" text-anchor="middle">force labels</text><text class="dg-s" x="875" y="86" text-anchor="middle">field + total F_z</text>
<path class="dg-a" d="M240 73 H290"/><path class="dg-a" d="M490 73 H540"/><path class="dg-a" d="M740 73 H790"/>
<text class="dg-h" x="20" y="138">POLICY: DIFFUSION POLICY AT 7 HZ, PREDICT 32, EXECUTE 16</text>
<rect class="dg-ext" x="20" y="156" width="230" height="70"/><text class="dg-t" x="135" y="178" text-anchor="middle">last 2 observations</text><text class="dg-s" x="135" y="196" text-anchor="middle">RGB 96x96, force field 96x96</text><text class="dg-s" x="135" y="212" text-anchor="middle">total F_z, pose, grip width</text>
<rect class="dg-box" x="290" y="156" width="220" height="70"/><text class="dg-t" x="400" y="184" text-anchor="middle">1D temporal CNN</text><text class="dg-s" x="400" y="204" text-anchor="middle">FiLM, DDIM 10 steps</text>
<rect class="dg-key" x="560" y="156" width="400" height="70"/><text class="dg-t" x="760" y="184" text-anchor="middle">action per step</text><text class="dg-s" x="760" y="204" text-anchor="middle">pose (3 + 6D), grip width w, grip force F_z</text>
<path class="dg-a" d="M250 191 H290"/><path class="dg-a" d="M510 191 H560"/>
<text class="dg-h" x="20" y="264">GRIPPER: DUAL-MODE CONTROL ON THE ACTUATED UMI</text>
<rect class="dg-box" x="20" y="282" width="280" height="58"/><text class="dg-t" x="160" y="306" text-anchor="middle">free space</text><text class="dg-s" x="160" y="324" text-anchor="middle">width w sent to the motor PD</text>
<rect class="dg-key" x="340" y="282" width="300" height="58"/><text class="dg-t" x="490" y="306" text-anchor="middle">in contact</text><text class="dg-s" x="490" y="324" text-anchor="middle">target and estimate below -0.5 N</text>
<rect class="dg-key" x="680" y="282" width="280" height="58"/><text class="dg-t" x="820" y="306" text-anchor="middle">force PID, 25 Hz</text><text class="dg-s" x="820" y="324" text-anchor="middle">e = estimate - target, added to width</text>
<path class="dg-a" d="M300 311 H340"/><path class="dg-a" d="M640 311 H680"/>
<path class="dg-ad" d="M900 226 V282"/>
<text class="dg-l" x="20" y="374">the arm follows the pose with Cartesian impedance; the grip follows force once contact is detected</text>
</svg>
