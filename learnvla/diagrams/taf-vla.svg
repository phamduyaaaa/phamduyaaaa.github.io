<rect class="dg-box" x="220" y="250" width="130" height="48"/><text class="dg-t" x="285" y="268" text-anchor="middle">π_VLM</text><text class="dg-s" x="285" y="283" text-anchor="middle">conditioning φ_t</text>
<path class="dg-a" d="M180 274 H220"/>
<rect class="dg-ext" x="220" y="326" width="130" height="40"/><text class="dg-t" x="285" y="344" text-anchor="middle">Proprio q_t</text>
