<rect class="dg-box" x="220" y="116" width="130" height="48"/><text class="dg-t" x="285" y="134" text-anchor="middle">ViT</text><text class="dg-s" x="285" y="149" text-anchor="middle">per frame h_tac</text>
<rect class="dg-box" x="390" y="116" width="150" height="48"/><text class="dg-t" x="465" y="134" text-anchor="middle">Causal Transformer</text><text class="dg-s" x="465" y="149" text-anchor="middle">summary token s → z*</text>
