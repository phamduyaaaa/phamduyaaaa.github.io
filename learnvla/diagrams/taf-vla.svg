<svg viewBox="0 0 980 400" xmlns="http://www.w3.org/2000/svg">
<rect class="dg-grp" x="10" y="8" width="960" height="184"/><text class="dg-h" x="22" y="26">(a) TACTILE–FORCE ALIGNMENT (self-supervised)</text>
