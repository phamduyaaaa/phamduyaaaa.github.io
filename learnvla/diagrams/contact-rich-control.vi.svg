<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">BA CÁCH BỘ ĐIỀU KHIỂN TẦNG THẤP XỬ LÝ MỘT ĐÍCH NẰM SAU BỀ MẶT</text>
<rect class="dg-badbox" x="20" y="50" width="290" height="110"/><text class="dg-t" x="165" y="76" text-anchor="middle">điều khiển vị trí cứng</text><text class="dg-s" x="165" y="98" text-anchor="middle">"phải đúng chỗ đó"</text><text class="dg-s" x="165" y="116" text-anchor="middle">đích lẹm 2 mm vào chi tiết:</text><text class="dg-s" x="165" y="134" text-anchor="middle">lực tăng tới khi có gì đó hỏng</text>
<rect class="dg-key" x="345" y="50" width="290" height="110"/><text class="dg-t" x="490" y="76" text-anchor="middle">impedance / admittance</text><text class="dg-s" x="490" y="98" text-anchor="middle">"như lò xo quanh chỗ đó"</text><text class="dg-s" x="490" y="116" text-anchor="middle">F = K (x_d - x) - D x'</text><text class="dg-s" x="490" y="134" text-anchor="middle">lẹm 2 mm, K 1000 N/m: khoảng 2 N</text>
<rect class="dg-key" x="670" y="50" width="290" height="110"/><text class="dg-t" x="815" y="76" text-anchor="middle">lai lực / vị trí</text><text class="dg-s" x="815" y="98" text-anchor="middle">"ấn 10 N xuống, giữ x và y"</text><text class="dg-s" x="815" y="116" text-anchor="middle">điều khiển lực theo vài trục,</text><text class="dg-s" x="815" y="134" text-anchor="middle">điều khiển vị trí theo các trục còn lại</text>
<rect class="dg-ext" x="20" y="200" width="290" height="80"/><text class="dg-t" x="165" y="226" text-anchor="middle">VLA xuất ra</text><text class="dg-s" x="165" y="246" text-anchor="middle">chunk tư thế, có thể kèm lực</text><text class="dg-s" x="165" y="262" text-anchor="middle">vài tới 50 lần mỗi giây</text>
<rect class="dg-box" x="345" y="200" width="290" height="80"/><text class="dg-t" x="490" y="226" text-anchor="middle">bộ điều khiển</text><text class="dg-s" x="490" y="246" text-anchor="middle">200 Hz tới 1 kHz, đọc lực,</text><text class="dg-s" x="490" y="262" text-anchor="middle">quyết định ấn mạnh bao nhiêu</text>
<rect class="dg-ext" x="670" y="200" width="290" height="80"/><text class="dg-t" x="815" y="226" text-anchor="middle">robot + chi tiết</text><text class="dg-s" x="815" y="246" text-anchor="middle">tiếp xúc cứng: sai số nhỏ,</text><text class="dg-s" x="815" y="262" text-anchor="middle">lực lớn</text>
<path class="dg-a" d="M310 240 H345"/><path class="dg-a" d="M635 240 H670"/><path class="dg-ad" d="M815 280 V302 H490 V280"/>
</svg>
