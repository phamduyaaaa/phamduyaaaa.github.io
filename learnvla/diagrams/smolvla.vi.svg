<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">SMOLVLA: NỬA VLM NHỎ + ACTION EXPERT NHẸ, CHẠY BẤT ĐỒNG BỘ</text>
<rect class="dg-ext" x="20" y="44" width="170" height="64"/><text class="dg-t" x="105" y="68" text-anchor="middle">ảnh</text><text class="dg-s" x="105" y="88" text-anchor="middle">ảnh tổng, 64 token mỗi ảnh</text>
<rect class="dg-ext" x="20" y="116" width="170" height="64"/><text class="dg-t" x="105" y="140" text-anchor="middle">câu lệnh + trạng thái</text><text class="dg-s" x="105" y="160" text-anchor="middle">chiếu tuyến tính</text>
