<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">ĐO LỰC Ở ĐÂU, TỪ ĐẾ ROBOT TỚI ĐẦU NGÓN</text>
<rect class="dg-box" x="20" y="60" width="210" height="96"/><text class="dg-t" x="125" y="84" text-anchor="middle">khớp</text><text class="dg-s" x="125" y="104" text-anchor="middle">cảm biến mô-men / dòng động cơ</text><text class="dg-s" x="125" y="120" text-anchor="middle">ước lượng lực: tau = J^T F</text><text class="dg-s" x="125" y="136" text-anchor="middle">không thêm phần cứng; lỗi ma sát</text>
<rect class="dg-key" x="260" y="60" width="210" height="96"/><text class="dg-t" x="365" y="84" text-anchor="middle">cảm biến F/T cổ tay</text><text class="dg-s" x="365" y="104" text-anchor="middle">6 số: Fx Fy Fz Tx Ty Tz</text><text class="dg-s" x="365" y="120" text-anchor="middle">nhanh; lẫn trọng lượng dụng cụ</text><text class="dg-s" x="365" y="136" text-anchor="middle">không biết chạm ở đâu</text>
<rect class="dg-box" x="500" y="60" width="210" height="96"/><text class="dg-t" x="605" y="84" text-anchor="middle">mảng áp suất / taxel</text><text class="dg-s" x="605" y="104" text-anchor="middle">áp trở, điện dung</text><text class="dg-s" x="605" y="120" text-anchor="middle">bản đồ thô, vd. 12 x 12</text><text class="dg-s" x="605" y="136" text-anchor="middle">chạm đâu và mạnh cỡ nào</text>
<rect class="dg-key" x="740" y="60" width="220" height="96"/><text class="dg-t" x="850" y="84" text-anchor="middle">xúc giác dựa trên camera</text><text class="dg-s" x="850" y="104" text-anchor="middle">gel + camera (GelSight)</text><text class="dg-s" x="850" y="120" text-anchor="middle">hình dạng mịn, trượt, ~30 Hz</text><text class="dg-s" x="850" y="136" text-anchor="middle">lực phải suy ra</text>
<path class="dg-a" d="M230 108 H260"/><path class="dg-a" d="M470 108 H500"/><path class="dg-a" d="M710 108 H740"/>
<text class="dg-l" x="20" y="186">gần đế: rẻ hơn, có sẵn, kém chính xác về tiếp xúc</text>
<text class="dg-l" x="520" y="186">gần đầu ngón: thông tin tiếp xúc giàu hơn, dễ hỏng hơn</text>
<rect class="dg-badbox" x="20" y="220" width="440" height="70"/><text class="dg-t" x="240" y="246" text-anchor="middle">lỗi thường gặp</text><text class="dg-s" x="240" y="266" text-anchor="middle">coi trọng lượng dụng cụ là lực tiếp xúc; quên hệ trục;</text><text class="dg-s" x="240" y="282" text-anchor="middle">về 0 một lần rồi nghiêng dụng cụ</text>
<rect class="dg-box" x="500" y="220" width="460" height="70"/><text class="dg-t" x="730" y="246" text-anchor="middle">policy nên nhận gì</text><text class="dg-s" x="730" y="266" text-anchor="middle">wrench đã bù trọng lực, đã trừ bias, trong hệ trục rõ ràng,</text><text class="dg-s" x="730" y="282" text-anchor="middle">đã chuẩn hóa, thường là một cửa sổ lịch sử ngắn</text>
</svg>
