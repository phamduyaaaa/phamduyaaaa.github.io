<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">LINGBOT-VLA 2.0: MORE DATA, MORE DEGREES OF FREEDOM, AND A FUTURE TO PREDICT</text>
<rect class="dg-ext" x="20" y="44" width="220" height="100"/><text class="dg-t" x="130" y="68" text-anchor="middle">~60,000 h pre-training</text><text class="dg-s" x="130" y="90" text-anchor="middle">50,000 h robot data,</text><text class="dg-s" x="130" y="106" text-anchor="middle">20 robot configurations</text><text class="dg-s" x="130" y="122" text-anchor="middle">+ 10,000 h egocentric human video</text>
<rect class="dg-box" x="20" y="160" width="220" height="100"/><text class="dg-t" x="130" y="184" text-anchor="middle">data pipeline</text><text class="dg-s" x="130" y="206" text-anchor="middle">VLM splits videos into subtasks;</text><text class="dg-s" x="130" y="222" text-anchor="middle">human hands lifted to 3D via</text><text class="dg-s" x="130" y="238" text-anchor="middle">SLAM + hand pose (MANO)</text>
<rect class="dg-key" x="290" y="44" width="230" height="216"/><text class="dg-t" x="405" y="72" text-anchor="middle">VLM backbone</text><text class="dg-s" x="405" y="94" text-anchor="middle">images + instruction</text><text class="dg-s" x="405" y="126" text-anchor="middle">+ two learnable queries:</text><text class="dg-s" x="405" y="142" text-anchor="middle">Q_t (now), Q_t+T (future)</text><text class="dg-s" x="405" y="176" text-anchor="middle">distilled from teachers:</text><text class="dg-s" x="405" y="192" text-anchor="middle">LingBot-Depth (geometry)</text><text class="dg-s" x="405" y="208" text-anchor="middle">DINO-Video (temporal)</text>
<rect class="dg-key" x="570" y="44" width="200" height="216"/><text class="dg-t" x="670" y="72" text-anchor="middle">action expert</text><text class="dg-s" x="670" y="94" text-anchor="middle">token-level sparse MoE</text><text class="dg-s" x="670" y="110" text-anchor="middle">in its FFN layers</text><text class="dg-s" x="670" y="142" text-anchor="middle">loss-free load balancing:</text><text class="dg-s" x="670" y="158" text-anchor="middle">router biases, no extra</text><text class="dg-s" x="670" y="174" text-anchor="middle">balancing loss</text>
<rect class="dg-box" x="810" y="44" width="150" height="216"/><text class="dg-t" x="885" y="72" text-anchor="middle">action space</text><text class="dg-s" x="885" y="94" text-anchor="middle">two arms +</text><text class="dg-s" x="885" y="110" text-anchor="middle">head, waist,</text><text class="dg-s" x="885" y="126" text-anchor="middle">mobile base,</text><text class="dg-s" x="885" y="142" text-anchor="middle">dexterous hands</text>
<path class="dg-a" d="M240 94 H290"/><path class="dg-a" d="M240 210 H290"/><path class="dg-a" d="M520 152 H570"/><path class="dg-a" d="M770 152 H810"/>
<text class="dg-l" x="20" y="296">the future query is trained to match the teachers' features of the frame one chunk ahead</text>
</svg>
