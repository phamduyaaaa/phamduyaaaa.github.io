<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">PI0.5: HỌC NHIỀU LOẠI DỮ LIỆU DƯỚI DẠNG TOKEN, RỒI THÊM FLOW EXPERT ĐỂ ĐIỀU KHIỂN</text>
<rect class="dg-box" x="20" y="44" width="150" height="50"/><text class="dg-t" x="95" y="66" text-anchor="middle">MM</text><text class="dg-s" x="95" y="84" text-anchor="middle">~400 giờ, ~100 nhà</text>
<rect class="dg-box" x="20" y="102" width="150" height="50"/><text class="dg-t" x="95" y="124" text-anchor="middle">ME + CE</text><text class="dg-s" x="95" y="142" text-anchor="middle">robot khác, dữ liệu lab</text>
<rect class="dg-box" x="20" y="160" width="150" height="50"/><text class="dg-t" x="95" y="182" text-anchor="middle">HL</text><text class="dg-s" x="95" y="200" text-anchor="middle">nhãn tác vụ con + khung</text>
<rect class="dg-box" x="20" y="218" width="150" height="50"/><text class="dg-t" x="95" y="240" text-anchor="middle">WD</text><text class="dg-s" x="95" y="258" text-anchor="middle">chú thích, VQA, khung</text>
<rect class="dg-key" x="220" y="80" width="230" height="150"/><text class="dg-t" x="335" y="106" text-anchor="middle">1. tiền huấn luyện</text><text class="dg-s" x="335" y="128" text-anchor="middle">một VLM, loss token kế</text><text class="dg-s" x="335" y="146" text-anchor="middle">chữ, khung, token FAST</text><text class="dg-s" x="335" y="164" text-anchor="middle">280k bước</text><text class="dg-s" x="335" y="190" text-anchor="middle">97,6% ví dụ không phải</text><text class="dg-s" x="335" y="206" text-anchor="middle">thao tác di động trong nhà</text>
<rect class="dg-key" x="500" y="80" width="230" height="150"/><text class="dg-t" x="615" y="106" text-anchor="middle">2. hậu huấn luyện</text><text class="dg-s" x="615" y="128" text-anchor="middle">thêm action expert</text><text class="dg-s" x="615" y="146" text-anchor="middle">flow matching (khởi tạo ngẫu nhiên)</text><text class="dg-s" x="615" y="164" text-anchor="middle">token + alpha x flow, alpha 10</text><text class="dg-s" x="615" y="190" text-anchor="middle">80k bước, + chỉ dẫn</text><text class="dg-s" x="615" y="206" text-anchor="middle">bằng lời (VI)</text>
<rect class="dg-box" x="780" y="60" width="180" height="70"/><text class="dg-t" x="870" y="84" text-anchor="middle">tầng cao</text><text class="dg-s" x="870" y="104" text-anchor="middle">"cất bát đĩa" →</text><text class="dg-s" x="870" y="120" text-anchor="middle">"nhặt cái đĩa"</text>
<rect class="dg-box" x="780" y="160" width="180" height="70"/><text class="dg-t" x="870" y="184" text-anchor="middle">tầng thấp</text><text class="dg-s" x="870" y="204" text-anchor="middle">tác vụ con → chunk</text><text class="dg-s" x="870" y="220" text-anchor="middle">10 bước flow, 50 Hz</text>
