<svg viewBox="0 0 980 380" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="26">STAGE 1: HUMAN TACTILE DEMONSTRATIONS, NO ROBOT</text>
<rect class="dg-ext" x="20" y="46" width="200" height="54"/><text class="dg-t" x="120" y="68" text-anchor="middle">GelSight on fingertip</text><text class="dg-s" x="120" y="86" text-anchor="middle">15 Hz, 400x300</text>
<rect class="dg-ext" x="240" y="46" width="200" height="54"/><text class="dg-t" x="340" y="68" text-anchor="middle">contact microphone</text><text class="dg-s" x="340" y="86" text-anchor="middle">at the hole, 44.1 kHz</text>
<rect class="dg-ext" x="460" y="46" width="200" height="54"/><text class="dg-t" x="560" y="68" text-anchor="middle">fingertip pose</text><text class="dg-s" x="560" y="86" text-anchor="middle">RealSense + ArUco</text>
<rect class="dg-box" x="740" y="46" width="220" height="54"/><text class="dg-t" x="850" y="68" text-anchor="middle">demo library</text><text class="dg-s" x="850" y="86" text-anchor="middle">20 successful demos</text>
<path class="dg-a" d="M660 73 H740"/>
<text class="dg-h" x="20" y="138">STAGE 2: OFFLINE POLICY BY NEAREST NEIGHBOUR</text>
<rect class="dg-key" x="20" y="156" width="200" height="54"/><text class="dg-t" x="120" y="178" text-anchor="middle">BYOL tactile encoder</text><text class="dg-s" x="120" y="196" text-anchor="middle">2048-D embedding</text>
<rect class="dg-key" x="240" y="156" width="200" height="54"/><text class="dg-t" x="340" y="178" text-anchor="middle">BYOL-A audio encoder</text><text class="dg-s" x="340" y="196" text-anchor="middle">mel-spectrogram, 2048-D</text>
<rect class="dg-box" x="460" y="156" width="200" height="54"/><text class="dg-t" x="560" y="178" text-anchor="middle">nearest neighbour</text><text class="dg-s" x="560" y="196" text-anchor="middle">query vs library</text>
<rect class="dg-box" x="740" y="156" width="220" height="54"/><text class="dg-t" x="850" y="178" text-anchor="middle">offline action a_o</text><text class="dg-s" x="850" y="196" text-anchor="middle">6-D delta EE pose, 5 Hz</text>
<path class="dg-a" d="M440 183 H460"/><path class="dg-a" d="M120 210 V226 H560 V210"/>
<path class="dg-a" d="M850 100 V128 H700 V183 H660"/>
<path class="dg-a" d="M660 196 H740"/>
<text class="dg-h" x="20" y="252">STAGE 3: ONLINE RESIDUAL RL ON THE ROBOT (SAC)</text>
<rect class="dg-box" x="20" y="270" width="220" height="54"/><text class="dg-t" x="130" y="292" text-anchor="middle">residual policy (MLP)</text><text class="dg-s" x="130" y="310" text-anchor="middle">touch, audio, pose, last action</text>
<rect class="dg-box" x="290" y="270" width="200" height="54"/><text class="dg-t" x="390" y="292" text-anchor="middle">residual a_r</text><text class="dg-s" x="390" y="310" text-anchor="middle">clipped: 0.15 cm, 3 deg</text>
<rect class="dg-key" x="540" y="270" width="200" height="54"/><text class="dg-t" x="640" y="292" text-anchor="middle">a = a_o + a_r</text><text class="dg-s" x="640" y="310" text-anchor="middle">IK to Franka Panda</text>
<rect class="dg-ext" x="790" y="270" width="170" height="54"/><text class="dg-t" x="875" y="292" text-anchor="middle">reward</text><text class="dg-s" x="875" y="310" text-anchor="middle">distance, angle, penalty</text>
<path class="dg-a" d="M240 297 H290"/><path class="dg-a" d="M490 297 H540"/><path class="dg-a" d="M740 297 H790"/>
<path class="dg-a" d="M850 210 V244 H640 V270"/>
<path class="dg-ad" d="M875 324 V344 H130 V324"/>
<text class="dg-l" x="300" y="366">only the residual learns on the robot; a_o stays fixed</text>
</svg>
