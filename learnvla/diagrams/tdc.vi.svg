<rect class="dg-box" x="700" y="282" width="260" height="58"/><text class="dg-t" x="830" y="306" text-anchor="middle">cánh tay Franka</text><text class="dg-s" x="830" y="324" text-anchor="middle">F_ext từ mô-men khớp</text>
