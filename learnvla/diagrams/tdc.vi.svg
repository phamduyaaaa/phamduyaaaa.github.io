<rect class="dg-ext" x="20" y="46" width="220" height="54"/><text class="dg-t" x="130" y="68" text-anchor="middle">vật quét 3D trong sim</text><text class="dg-s" x="130" y="86" text-anchor="middle">pose, ánh sáng ngẫu nhiên</text>
<rect class="dg-box" x="290" y="46" width="220" height="54"/><text class="dg-t" x="400" y="68" text-anchor="middle">chuyên gia đặc quyền</text><text class="dg-s" x="400" y="86" text-anchor="middle">luật theo trạng thái tiếp xúc</text>
