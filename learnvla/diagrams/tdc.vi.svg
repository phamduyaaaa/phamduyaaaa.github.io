<rect class="dg-box" x="560" y="156" width="400" height="70"/><text class="dg-t" x="760" y="184" text-anchor="middle">pose X (10) + khung tác vụ T (6) + chế độ C (6)</text><text class="dg-s" x="760" y="204" text-anchor="middle">C mỗi trục: 0 lực, 1 mềm, 4 cứng</text>
