<rect class="dg-key" x="810" y="46" width="150" height="54"/><text class="dg-t" x="885" y="68" text-anchor="middle">nhãn</text><text class="dg-s" x="885" y="86" text-anchor="middle">pose, khung, chế độ</text>
<path class="dg-a" d="M240 73 H290"/><path class="dg-a" d="M510 73 H560"/><path class="dg-a" d="M760 73 H810"/>
<text class="dg-h" x="20" y="138">CHÍNH SÁCH: E2VLA VỚI LỚP VÀO VÀ RA MỞ RỘNG</text>
<rect class="dg-ext" x="20" y="156" width="220" height="70"/><text class="dg-t" x="130" y="184" text-anchor="middle">RGB cổ tay + camera ngoài</text><text class="dg-s" x="130" y="204" text-anchor="middle">câu lệnh, pose EE, tay kẹp</text>
