<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">A TEACHER THAT HAS SOMETHING THE STUDENT WILL NOT HAVE AT RUN TIME</text>
<rect class="dg-ext" x="20" y="54" width="170" height="56"/><text class="dg-t" x="105" y="78" text-anchor="middle">training input</text><text class="dg-s" x="105" y="96" text-anchor="middle">images + state (+ F/T)</text>
<rect class="dg-key" x="250" y="40" width="210" height="84"/><text class="dg-t" x="355" y="68" text-anchor="middle">teacher</text><text class="dg-s" x="355" y="88" text-anchor="middle">bigger, or sees privileged</text><text class="dg-s" x="355" y="104" text-anchor="middle">signals (real force, touch)</text>
<rect class="dg-box" x="250" y="170" width="210" height="84"/><text class="dg-t" x="355" y="198" text-anchor="middle">student</text><text class="dg-s" x="355" y="218" text-anchor="middle">smaller, or without</text><text class="dg-s" x="355" y="234" text-anchor="middle">the extra sensor</text>
<path class="dg-a" d="M190 76 H250"/><path class="dg-a" d="M190 96 H220 V212 H250"/>
<rect class="dg-box" x="530" y="40" width="200" height="84"/><text class="dg-t" x="630" y="68" text-anchor="middle">soft targets</text><text class="dg-s" x="630" y="88" text-anchor="middle">probabilities at temperature T</text><text class="dg-s" x="630" y="104" text-anchor="middle">or a feature / force token</text>
<path class="dg-a" d="M460 82 H530"/>
<rect class="dg-key" x="530" y="170" width="200" height="84"/><text class="dg-t" x="630" y="198" text-anchor="middle">match the teacher</text><text class="dg-s" x="630" y="218" text-anchor="middle">cross-entropy or</text><text class="dg-s" x="630" y="234" text-anchor="middle">feature distance</text>
<path class="dg-a" d="M630 124 V170"/><path class="dg-a" d="M460 212 H530"/>
<rect class="dg-box" x="790" y="170" width="170" height="84"/><text class="dg-t" x="875" y="198" text-anchor="middle">deploy student</text><text class="dg-s" x="875" y="218" text-anchor="middle">faster, or no sensor</text><text class="dg-s" x="875" y="234" text-anchor="middle">needed on the robot</text>
<path class="dg-a" d="M730 212 H790"/>
</svg>
