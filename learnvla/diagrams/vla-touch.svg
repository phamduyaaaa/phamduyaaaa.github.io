<text class="dg-h" x="20" y="300">OUTER LOOP: instruction done or max steps → tactile text → planner → next instruction</text>
<text class="dg-h" x="20" y="318">INNER LOOP: VLA chunk → refine first 48 of 64 steps with tactile force → execute</text>
