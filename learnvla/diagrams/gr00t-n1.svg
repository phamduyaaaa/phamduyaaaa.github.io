<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">GR00T N1: SLOW VLM (SYSTEM 2) + FAST FLOW-MATCHING DiT (SYSTEM 1), PER-ROBOT ADAPTERS</text>
<rect class="dg-ext" x="20" y="44" width="170" height="60"/><text class="dg-t" x="105" y="68" text-anchor="middle">images + text</text><text class="dg-s" x="105" y="88" text-anchor="middle">224px, 64 tokens/frame</text>
<rect class="dg-key" x="220" y="44" width="250" height="60"/><text class="dg-t" x="345" y="68" text-anchor="middle">System 2: Eagle-2 VLM</text><text class="dg-s" x="345" y="88" text-anchor="middle">SigLIP-2 + SmolLM2, 1.34B, 10 Hz</text>
<rect class="dg-box" x="500" y="44" width="210" height="60"/><text class="dg-t" x="605" y="68" text-anchor="middle">layer-12 features</text><text class="dg-s" x="605" y="88" text-anchor="middle">middle layer, not the last</text>
<path class="dg-a" d="M190 74 H220"/><path class="dg-a" d="M470 74 H500"/>
<rect class="dg-ext" x="20" y="150" width="170" height="60"/><text class="dg-t" x="105" y="174" text-anchor="middle">robot state q</text><text class="dg-s" x="105" y="194" text-anchor="middle">any dimension</text>
<rect class="dg-box" x="220" y="150" width="170" height="60"/><text class="dg-t" x="305" y="174" text-anchor="middle">state encoder</text><text class="dg-s" x="305" y="194" text-anchor="middle">one MLP per body</text>
<rect class="dg-ext" x="20" y="226" width="170" height="60"/><text class="dg-t" x="105" y="250" text-anchor="middle">noisy chunk</text><text class="dg-s" x="105" y="270" text-anchor="middle">H = 16 actions</text>
<rect class="dg-box" x="220" y="226" width="170" height="60"/><text class="dg-t" x="305" y="250" text-anchor="middle">action encoder</text><text class="dg-s" x="305" y="270" text-anchor="middle">one MLP per body</text>
<rect class="dg-key" x="430" y="150" width="280" height="136"/><text class="dg-t" x="570" y="178" text-anchor="middle">System 1: DiT</text><text class="dg-s" x="570" y="200" text-anchor="middle">self-attention on state + actions,</text><text class="dg-s" x="570" y="216" text-anchor="middle">cross-attention to VLM features</text><text class="dg-s" x="570" y="240" text-anchor="middle">flow matching, K = 4 Euler steps</text><text class="dg-s" x="570" y="256" text-anchor="middle">63.9 ms per chunk on an L40</text>
<rect class="dg-box" x="750" y="150" width="210" height="136"/><text class="dg-t" x="855" y="178" text-anchor="middle">action decoder</text><text class="dg-s" x="855" y="200" text-anchor="middle">one per body</text><text class="dg-s" x="855" y="230" text-anchor="middle">actions at 120 Hz</text><text class="dg-s" x="855" y="246" text-anchor="middle">arm, hands, humanoid</text>
<path class="dg-a" d="M190 180 H220"/><path class="dg-a" d="M190 256 H220"/><path class="dg-a" d="M390 180 H430"/><path class="dg-a" d="M390 256 H430"/><path class="dg-a" d="M605 104 V150"/><path class="dg-a" d="M710 218 H750"/>
<text class="dg-l" x="20" y="316">action-less data (human videos, generated videos) gets labels from a latent-action VQ-VAE or an inverse dynamics model</text>
</svg>
