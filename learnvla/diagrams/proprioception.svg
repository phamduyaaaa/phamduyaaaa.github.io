<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">WHAT THE ROBOT KNOWS ABOUT ITS OWN BODY</text>
<rect class="dg-ext" x="20" y="44" width="190" height="50"/><text class="dg-t" x="115" y="66" text-anchor="middle">joint encoders</text><text class="dg-s" x="115" y="82" text-anchor="middle">angles q, velocities</text>
<rect class="dg-ext" x="20" y="104" width="190" height="50"/><text class="dg-t" x="115" y="126" text-anchor="middle">motor currents / torques</text><text class="dg-s" x="115" y="142" text-anchor="middle">how hard each joint works</text>
<rect class="dg-ext" x="20" y="164" width="190" height="50"/><text class="dg-t" x="115" y="186" text-anchor="middle">gripper</text><text class="dg-s" x="115" y="202" text-anchor="middle">opening width</text>
<rect class="dg-ext" x="20" y="224" width="190" height="50"/><text class="dg-t" x="115" y="246" text-anchor="middle">wrist F/T sensor</text><text class="dg-s" x="115" y="262" text-anchor="middle">wrench, 6 numbers</text>
<rect class="dg-box" x="270" y="44" width="190" height="50"/><text class="dg-t" x="365" y="66" text-anchor="middle">forward kinematics</text><text class="dg-s" x="365" y="82" text-anchor="middle">q to gripper pose</text>
<path class="dg-a" d="M210 69 H270"/>
<rect class="dg-key" x="520" y="104" width="190" height="110"/><text class="dg-t" x="615" y="146" text-anchor="middle">state vector s</text><text class="dg-s" x="615" y="166" text-anchor="middle">normalised,</text><text class="dg-s" x="615" y="182" text-anchor="middle">usually the current step only</text>
<path class="dg-a" d="M460 69 H490 V130 H520"/><path class="dg-a" d="M210 129 H520"/><path class="dg-a" d="M210 189 H520"/><path class="dg-a" d="M210 249 H490 V200 H520"/>
<rect class="dg-box" x="770" y="104" width="190" height="110"/><text class="dg-t" x="865" y="146" text-anchor="middle">policy</text><text class="dg-s" x="865" y="166" text-anchor="middle">with the camera tokens</text><text class="dg-s" x="865" y="182" text-anchor="middle">and the instruction</text>
<path class="dg-a" d="M710 159 H770"/>
<text class="dg-note dg-red" x="520" y="250">a long state history lets the policy copy its last action</text>
</svg>
