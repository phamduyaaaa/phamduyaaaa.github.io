<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">TWO WAYS TO TURN A 1-SECOND ACTION CHUNK INTO TOKENS</text>
<rect class="dg-ext" x="20" y="44" width="170" height="60"/><text class="dg-t" x="105" y="68" text-anchor="middle">Action chunk</text><text class="dg-s" x="105" y="86" text-anchor="middle">H steps x D dimensions</text>
<rect class="dg-badbox" x="250" y="44" width="200" height="60"/><text class="dg-t" x="350" y="68" text-anchor="middle">Binning, per value</text><text class="dg-s" x="350" y="86" text-anchor="middle">256 bins each</text>
<rect class="dg-badbox" x="510" y="44" width="200" height="60"/><text class="dg-t" x="610" y="68" text-anchor="middle">H x D tokens</text><text class="dg-s" x="610" y="86" text-anchor="middle">50 Hz, 7-D: 350 tokens</text>
<path class="dg-a" d="M190 74 H250"/><path class="dg-a" d="M450 74 H510"/>
<text class="dg-note dg-red" x="730" y="70">neighbouring tokens nearly equal:</text><text class="dg-note dg-red" x="730" y="88">little new information each</text>
<text class="dg-h" x="20" y="150">FAST (01/2025)</text>
<rect class="dg-box" x="20" y="166" width="140" height="60"/><text class="dg-t" x="90" y="190" text-anchor="middle">Normalise</text><text class="dg-s" x="90" y="208" text-anchor="middle">1st-99th pct to [-1,1]</text>
<rect class="dg-key" x="190" y="166" width="140" height="60"/><text class="dg-t" x="260" y="190" text-anchor="middle">DCT per dim</text><text class="dg-s" x="260" y="208" text-anchor="middle">time to frequency</text>
<rect class="dg-key" x="360" y="166" width="140" height="60"/><text class="dg-t" x="430" y="190" text-anchor="middle">Scale + round</text><text class="dg-s" x="430" y="208" text-anchor="middle">small terms become 0</text>
<rect class="dg-box" x="530" y="166" width="150" height="60"/><text class="dg-t" x="605" y="190" text-anchor="middle">Flatten</text><text class="dg-s" x="605" y="208" text-anchor="middle">low frequencies first</text>
<rect class="dg-key" x="710" y="166" width="120" height="60"/><text class="dg-t" x="770" y="190" text-anchor="middle">BPE</text><text class="dg-s" x="770" y="208" text-anchor="middle">squash zeros</text>
<rect class="dg-box" x="860" y="166" width="100" height="60"/><text class="dg-t" x="910" y="190" text-anchor="middle">~30</text><text class="dg-s" x="910" y="208" text-anchor="middle">tokens per arm</text>
<path class="dg-a" d="M160 196 H190"/><path class="dg-a" d="M330 196 H360"/><path class="dg-a" d="M500 196 H530"/><path class="dg-a" d="M680 196 H710"/><path class="dg-a" d="M830 196 H860"/>
<text class="dg-l" x="20" y="262">a smooth motion has its energy in a few low frequencies, so most rounded coefficients are 0</text>
<text class="dg-l" x="20" y="284">the token count follows the complexity of the motion, not the control rate</text>
</svg>
