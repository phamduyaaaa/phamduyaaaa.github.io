<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">THREE WAYS A LOW-LEVEL CONTROLLER CAN TREAT A TARGET THAT HITS A SURFACE</text>
<rect class="dg-badbox" x="20" y="50" width="290" height="110"/><text class="dg-t" x="165" y="76" text-anchor="middle">stiff position control</text><text class="dg-s" x="165" y="98" text-anchor="middle">"be exactly there"</text><text class="dg-s" x="165" y="116" text-anchor="middle">target 2 mm inside the part:</text><text class="dg-s" x="165" y="134" text-anchor="middle">force rises until something gives</text>
<rect class="dg-key" x="345" y="50" width="290" height="110"/><text class="dg-t" x="490" y="76" text-anchor="middle">impedance / admittance</text><text class="dg-s" x="490" y="98" text-anchor="middle">"act like a spring around there"</text><text class="dg-s" x="490" y="116" text-anchor="middle">F = K (x_d - x) - D x'</text><text class="dg-s" x="490" y="134" text-anchor="middle">2 mm inside, K 1000 N/m: about 2 N</text>
<rect class="dg-key" x="670" y="50" width="290" height="110"/><text class="dg-t" x="815" y="76" text-anchor="middle">hybrid force / position</text><text class="dg-s" x="815" y="98" text-anchor="middle">"push 10 N down, hold x and y"</text><text class="dg-s" x="815" y="116" text-anchor="middle">force control along some axes,</text><text class="dg-s" x="815" y="134" text-anchor="middle">position control along the rest</text>
<rect class="dg-ext" x="20" y="200" width="290" height="80"/><text class="dg-t" x="165" y="226" text-anchor="middle">VLA outputs</text><text class="dg-s" x="165" y="246" text-anchor="middle">a pose chunk, maybe a force</text><text class="dg-s" x="165" y="262" text-anchor="middle">a few to 50 times a second</text>
<rect class="dg-box" x="345" y="200" width="290" height="80"/><text class="dg-t" x="490" y="226" text-anchor="middle">controller</text><text class="dg-s" x="490" y="246" text-anchor="middle">200 Hz to 1 kHz, reads the force,</text><text class="dg-s" x="490" y="262" text-anchor="middle">decides how hard to push</text>
<rect class="dg-ext" x="670" y="200" width="290" height="80"/><text class="dg-t" x="815" y="226" text-anchor="middle">robot + part</text><text class="dg-s" x="815" y="246" text-anchor="middle">rigid contact: tiny error,</text><text class="dg-s" x="815" y="262" text-anchor="middle">large force</text>
<path class="dg-a" d="M310 240 H345"/><path class="dg-a" d="M635 240 H670"/><path class="dg-ad" d="M815 280 V302 H490 V280"/>
</svg>
