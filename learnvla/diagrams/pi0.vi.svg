<svg viewBox="0 0 980 380" xmlns="http://www.w3.org/2000/svg">
<rect class="dg-ext" x="20" y="40" width="150" height="56"/><text class="dg-t" x="95" y="64" text-anchor="middle">Ảnh camera</text><text class="dg-s" x="95" y="80" text-anchor="middle">2-3 mỗi robot</text>
<rect class="dg-ext" x="20" y="120" width="150" height="56"/><text class="dg-t" x="95" y="144" text-anchor="middle">Ngôn ngữ l</text><text class="dg-s" x="95" y="160" text-anchor="middle">câu lệnh tác vụ</text>
<rect class="dg-grp" x="230" y="24" width="250" height="170"/><text class="dg-h" x="242" y="42">VLM BACKBONE (PaliGemma, 3B)</text>
<rect class="dg-box" x="250" y="62" width="210" height="110"/><text class="dg-t" x="355" y="100" text-anchor="middle">Token ảnh + chữ</text><text class="dg-s" x="355" y="118" text-anchor="middle">Các lớp Transformer</text><text class="dg-s" x="355" y="134" text-anchor="middle">tri thức cỡ internet</text>
<path class="dg-a" d="M170 68 H200 V90 H250"/><path class="dg-a" d="M170 148 H200 V140 H250"/>
<rect class="dg-grp" x="230" y="214" width="530" height="150"/><text class="dg-h" x="242" y="232">ACTION EXPERT (300M, trọng số riêng, học từ đầu)</text>
<rect class="dg-ext" x="20" y="248" width="150" height="48"/><text class="dg-t" x="95" y="268" text-anchor="middle">Trạng thái q_t</text><text class="dg-s" x="95" y="284" text-anchor="middle">góc khớp</text>
<rect class="dg-box" x="250" y="252" width="130" height="44"/><text class="dg-t" x="315" y="272" text-anchor="middle">Token trạng thái</text><text class="dg-s" x="315" y="287" text-anchor="middle">chiếu tuyến tính</text>
<path class="dg-a" d="M170 272 H250"/>
<rect class="dg-ext" x="20" y="312" width="150" height="48"/><text class="dg-t" x="95" y="332" text-anchor="middle">Hành động nhiễu</text><text class="dg-s" x="95" y="348" text-anchor="middle">A^τ, H=50 bước</text>
<rect class="dg-key" x="410" y="252" width="190" height="96"/><text class="dg-t" x="505" y="286" text-anchor="middle">Token hành động</text><text class="dg-s" x="505" y="304" text-anchor="middle">+ embedding bước τ</text><text class="dg-s" x="505" y="320" text-anchor="middle">hai chiều giữa các hành động</text>
<path class="dg-a" d="M170 336 H300 V320 H410"/><path class="dg-a" d="M380 274 H410"/>
<path class="dg-ad" d="M355 172 V214 H500 V252"/><text class="dg-l" x="430" y="208">nhìn sang ảnh+chữ (lưu đệm)</text>
<rect class="dg-key" x="650" y="262" width="90" height="76"/><text class="dg-t" x="695" y="296" text-anchor="middle">v_θ</text><text class="dg-s" x="695" y="314" text-anchor="middle">vận tốc</text>
<path class="dg-a" d="M600 300 H650"/>
<rect class="dg-box" x="800" y="262" width="160" height="76"/><text class="dg-t" x="880" y="288" text-anchor="middle">Bước Euler</text><text class="dg-s" x="880" y="306" text-anchor="middle">A ← A + δ·v_θ</text><text class="dg-s" x="880" y="322" text-anchor="middle">10 bước, δ = 0,1</text>
<path class="dg-a" d="M740 300 H800"/>
<path class="dg-ad" d="M880 262 V236 H400 V252"/><text class="dg-l" x="730" y="228" text-anchor="middle">lặp với A^τ đã cập nhật</text>
<rect class="dg-box" x="800" y="130" width="160" height="60"/><text class="dg-t" x="880" y="156" text-anchor="middle">Chunk hành động</text><text class="dg-s" x="880" y="174" text-anchor="middle">50 bước, tới 50 Hz</text>
<path class="dg-a" d="M900 262 V190"/>
</svg>
