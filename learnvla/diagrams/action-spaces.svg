<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">FOUR CHOICES BEHIND ONE ACTION VECTOR</text>
<rect class="dg-box" x="20" y="44" width="220" height="96"/><text class="dg-t" x="130" y="68" text-anchor="middle">1. What is commanded</text><text class="dg-s" x="130" y="90" text-anchor="middle">joint angles (one per joint)</text><text class="dg-s" x="130" y="106" text-anchor="middle">or gripper pose (x, y, z, rotation)</text><text class="dg-s" x="130" y="122" text-anchor="middle">+ gripper opening</text>
<rect class="dg-box" x="260" y="44" width="220" height="96"/><text class="dg-t" x="370" y="68" text-anchor="middle">2. Absolute or delta</text><text class="dg-s" x="370" y="90" text-anchor="middle">"go to here"</text><text class="dg-s" x="370" y="106" text-anchor="middle">or "move by this much"</text><text class="dg-s" x="370" y="122" text-anchor="middle">deltas add up their errors</text>
<rect class="dg-key" x="500" y="44" width="220" height="96"/><text class="dg-t" x="610" y="68" text-anchor="middle">3. Rotation encoding</text><text class="dg-s" x="610" y="90" text-anchor="middle">Euler: jumps at +-180 deg</text><text class="dg-s" x="610" y="106" text-anchor="middle">quaternion: q and -q are equal</text><text class="dg-s" x="610" y="122" text-anchor="middle">6D: continuous</text>
<rect class="dg-box" x="740" y="44" width="220" height="96"/><text class="dg-t" x="850" y="68" text-anchor="middle">4. Frame and scale</text><text class="dg-s" x="850" y="90" text-anchor="middle">base frame or tool frame</text><text class="dg-s" x="850" y="106" text-anchor="middle">normalise each dimension</text><text class="dg-s" x="850" y="122" text-anchor="middle">to about [-1, 1]</text>
<rect class="dg-ext" x="260" y="190" width="460" height="56"/><text class="dg-t" x="490" y="214" text-anchor="middle">one action vector a_t, then a chunk a_t ... a_t+H-1</text><text class="dg-s" x="490" y="232" text-anchor="middle">the policy only learns well if every dataset uses the same convention</text>
<path class="dg-a" d="M130 140 V170 H490 V190"/><path class="dg-a" d="M370 140 V170"/><path class="dg-a" d="M610 140 V170"/><path class="dg-a" d="M850 140 V170 H490"/>
</svg>
