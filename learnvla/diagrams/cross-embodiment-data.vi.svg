<svg viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">NHIỀU THÂN ROBOT, MỘT MÔ HÌNH: NHỮNG GÌ PHẢI ĐỒNG NHẤT</text>
<rect class="dg-ext" x="20" y="44" width="180" height="46"/><text class="dg-t" x="110" y="64" text-anchor="middle">UR5e + tay kẹp</text><text class="dg-s" x="110" y="80" text-anchor="middle">hành động 7 chiều, 2 camera</text>
<rect class="dg-ext" x="20" y="100" width="180" height="46"/><text class="dg-t" x="110" y="120" text-anchor="middle">hai tay 6 bậc</text><text class="dg-s" x="110" y="136" text-anchor="middle">hành động 14 chiều, 3 camera</text>
<rect class="dg-ext" x="20" y="156" width="180" height="46"/><text class="dg-t" x="110" y="176" text-anchor="middle">di động, hai tay</text><text class="dg-s" x="110" y="192" text-anchor="middle">hành động 16 hoặc 17 chiều</text>
<rect class="dg-ext" x="20" y="212" width="180" height="46"/><text class="dg-t" x="110" y="232" text-anchor="middle">bộ dữ liệu mở</text><text class="dg-s" x="110" y="248" text-anchor="middle">2-10 Hz, 1-2 camera</text>
<rect class="dg-key" x="260" y="44" width="210" height="46"/><text class="dg-t" x="365" y="64" text-anchor="middle">một định dạng dữ liệu</text><text class="dg-s" x="365" y="80" text-anchor="middle">cùng trường, cùng đơn vị</text>
<rect class="dg-key" x="260" y="100" width="210" height="46"/><text class="dg-t" x="365" y="120" text-anchor="middle">đệm theo thân lớn nhất</text><text class="dg-s" x="365" y="136" text-anchor="middle">số 0 + che camera thiếu</text>
<rect class="dg-key" x="260" y="156" width="210" height="46"/><text class="dg-t" x="365" y="176" text-anchor="middle">chuẩn hóa theo bộ dữ liệu</text><text class="dg-s" x="365" y="192" text-anchor="middle">thống kê riêng của từng robot</text>
<rect class="dg-key" x="260" y="212" width="210" height="46"/><text class="dg-t" x="365" y="232" text-anchor="middle">cân lại tỉ lệ trộn</text><text class="dg-s" x="365" y="248" text-anchor="middle">bộ lớn bị giảm trọng số</text>
<path class="dg-a" d="M200 67 H260"/><path class="dg-a" d="M200 123 H260"/><path class="dg-a" d="M200 179 H260"/><path class="dg-a" d="M200 235 H260"/>
<rect class="dg-box" x="540" y="100" width="190" height="102"/><text class="dg-t" x="635" y="140" text-anchor="middle">một policy</text><text class="dg-s" x="635" y="160" text-anchor="middle">backbone dùng chung</text><text class="dg-s" x="635" y="176" text-anchor="middle">(+ lớp vào/ra riêng mỗi thân)</text>
<path class="dg-a" d="M470 67 H505 V130 H540"/><path class="dg-a" d="M470 151 H540"/><path class="dg-a" d="M470 179 H540"/><path class="dg-a" d="M470 235 H505 V190 H540"/>
<rect class="dg-box" x="790" y="100" width="170" height="102"/><text class="dg-t" x="875" y="140" text-anchor="middle">fine-tune</text><text class="dg-s" x="875" y="160" text-anchor="middle">trên robot của bạn</text><text class="dg-s" x="875" y="176" text-anchor="middle">bộ dữ liệu nhỏ</text>
<path class="dg-a" d="M730 151 H790"/>
