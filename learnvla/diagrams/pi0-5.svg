<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">PI0.5: TRAIN ON MANY KINDS OF DATA AS TOKENS, THEN ADD A FLOW EXPERT FOR CONTROL</text>
<rect class="dg-box" x="20" y="44" width="150" height="50"/><text class="dg-t" x="95" y="66" text-anchor="middle">MM</text><text class="dg-s" x="95" y="84" text-anchor="middle">~400 h, ~100 homes</text>
<rect class="dg-box" x="20" y="102" width="150" height="50"/><text class="dg-t" x="95" y="124" text-anchor="middle">ME + CE</text><text class="dg-s" x="95" y="142" text-anchor="middle">other robots, lab data</text>
<rect class="dg-box" x="20" y="160" width="150" height="50"/><text class="dg-t" x="95" y="182" text-anchor="middle">HL</text><text class="dg-s" x="95" y="200" text-anchor="middle">subtask labels + boxes</text>
<rect class="dg-box" x="20" y="218" width="150" height="50"/><text class="dg-t" x="95" y="240" text-anchor="middle">WD</text><text class="dg-s" x="95" y="258" text-anchor="middle">captions, VQA, boxes</text>
<rect class="dg-key" x="220" y="80" width="230" height="150"/><text class="dg-t" x="335" y="106" text-anchor="middle">1. pre-training</text><text class="dg-s" x="335" y="128" text-anchor="middle">one VLM, next-token loss</text><text class="dg-s" x="335" y="146" text-anchor="middle">text, boxes, FAST action tokens</text><text class="dg-s" x="335" y="164" text-anchor="middle">280k steps</text><text class="dg-s" x="335" y="190" text-anchor="middle">97.6% of examples are not</text><text class="dg-s" x="335" y="206" text-anchor="middle">home mobile manipulation</text>
<rect class="dg-key" x="500" y="80" width="230" height="150"/><text class="dg-t" x="615" y="106" text-anchor="middle">2. post-training</text><text class="dg-s" x="615" y="128" text-anchor="middle">add a flow-matching action</text><text class="dg-s" x="615" y="146" text-anchor="middle">expert (random init)</text><text class="dg-s" x="615" y="164" text-anchor="middle">tokens + alpha x flow, alpha 10</text><text class="dg-s" x="615" y="190" text-anchor="middle">80k steps, + verbal</text><text class="dg-s" x="615" y="206" text-anchor="middle">instructions (VI)</text>
<rect class="dg-box" x="780" y="60" width="180" height="70"/><text class="dg-t" x="870" y="84" text-anchor="middle">high level</text><text class="dg-s" x="870" y="104" text-anchor="middle">"put away dishes" →</text><text class="dg-s" x="870" y="120" text-anchor="middle">"pick up the plate"</text>
<rect class="dg-box" x="780" y="160" width="180" height="70"/><text class="dg-t" x="870" y="184" text-anchor="middle">low level</text><text class="dg-s" x="870" y="204" text-anchor="middle">subtask → action chunk</text><text class="dg-s" x="870" y="220" text-anchor="middle">10 flow steps, 50 Hz</text>
<path class="dg-a" d="M170 69 H195 V155 H220"/><path class="dg-a" style="marker-end:none" d="M170 127 H195"/><path class="dg-a" style="marker-end:none" d="M170 185 H195"/><path class="dg-a" style="marker-end:none" d="M170 243 H195 V155"/>
<path class="dg-a" d="M450 155 H500"/><path class="dg-a" d="M730 120 H755 V95 H780"/><path class="dg-a" d="M870 130 V160"/>
<text class="dg-l" x="20" y="300">the same model writes the subtask in text, then generates the actions for that subtask</text>
</svg>
