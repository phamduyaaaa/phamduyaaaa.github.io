<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg">
<text class="dg-h" x="20" y="24">OCTO: TOKEN VÀO, TOKEN READOUT RA, ĐẦU RA THAY ĐƯỢC</text>
<rect class="dg-ext" x="20" y="44" width="180" height="56"/><text class="dg-t" x="110" y="68" text-anchor="middle">ngôn ngữ</text><text class="dg-s" x="110" y="86" text-anchor="middle">t5-base, 16 token</text>
<rect class="dg-ext" x="20" y="110" width="180" height="56"/><text class="dg-t" x="110" y="134" text-anchor="middle">hoặc ảnh đích</text><text class="dg-s" x="110" y="152" text-anchor="middle">CNN nông, chia ô</text>
<rect class="dg-ext" x="20" y="176" width="180" height="56"/><text class="dg-t" x="110" y="200" text-anchor="middle">ảnh camera</text><text class="dg-s" x="110" y="218" text-anchor="middle">lịch sử 2 khung</text>
<rect class="dg-badbox" x="20" y="242" width="180" height="56"/><text class="dg-t" x="110" y="266" text-anchor="middle">+ F/T (khi fine-tune)</text><text class="dg-s" x="110" y="284" text-anchor="middle">tokenizer mới, có mask</text>
<rect class="dg-key" x="260" y="80" width="260" height="150"/><text class="dg-t" x="390" y="110" text-anchor="middle">Transformer backbone</text><text class="dg-s" x="390" y="132" text-anchor="middle">Octo-Base: 12 lớp, rộng 768</text><text class="dg-s" x="390" y="150" text-anchor="middle">mask theo khối: quan sát</text><text class="dg-s" x="390" y="166" text-anchor="middle">thấy tác vụ + bước trước;</text><text class="dg-s" x="390" y="182" text-anchor="middle">đầu vào thiếu bị che hết</text><text class="dg-s" x="390" y="206" text-anchor="middle">token readout chỉ đọc</text>
<rect class="dg-box" x="580" y="80" width="190" height="70"/><text class="dg-t" x="675" y="106" text-anchor="middle">đầu diffusion</text><text class="dg-s" x="675" y="126" text-anchor="middle">3-layer MLP, DDPM</text><text class="dg-s" x="675" y="142" text-anchor="middle">→ chunk hành động</text>
<rect class="dg-badbox" x="580" y="170" width="190" height="60"/><text class="dg-t" x="675" y="196" text-anchor="middle">đầu mới</text><text class="dg-s" x="675" y="216" text-anchor="middle">vd. khớp 14 chiều (ALOHA)</text>
<rect class="dg-box" x="810" y="80" width="150" height="70"/><text class="dg-t" x="885" y="106" text-anchor="middle">robot</text><text class="dg-s" x="885" y="126" text-anchor="middle">delta EE, hoặc</text><text class="dg-s" x="885" y="142" text-anchor="middle">không gian hành động mới</text>
<path class="dg-a" d="M200 72 H230 V150 H260"/><path class="dg-a" style="marker-end:none" d="M200 138 H230"/><path class="dg-a" style="marker-end:none" d="M200 204 H230 V160"/><path class="dg-ad" d="M200 270 H240 V200 H260"/>
<path class="dg-a" d="M520 115 H580"/><path class="dg-ad" d="M520 200 H580"/><path class="dg-a" d="M770 115 H810"/>
<text class="dg-l" x="580" y="270">nét đứt: thêm lúc fine-tune, với ~100 demo,</text>
<text class="dg-l" x="580" y="288">không khởi tạo lại backbone</text>
</svg>
