<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control — Embodied AI VLA</title>
  
  <!-- 1. Core Design Tokens & Layout Architecture -->
  <link rel="stylesheet" href="./styles/variables.css" />
  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/layout.css" />

  <!-- 2. Modular Components CSS (Class-only styling, 0% ID) -->
  <link rel="stylesheet" href="./styles/components/header.css" />
  <link rel="stylesheet" href="./styles/components/sidebar.css" />
  <link rel="stylesheet" href="./styles/components/week-list.css" />
  <link rel="stylesheet" href="./styles/components/mission-tape.css" />
  <link rel="stylesheet" href="./styles/components/filter-bar.css" />
  <link rel="stylesheet" href="./styles/components/task-table.css" />
  <link rel="stylesheet" href="./styles/components/playbook.css" />
  <link rel="stylesheet" href="./styles/components/notes.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="layout-wrapper">
    <!-- TOP NAVIGATION BAR -->
    <header class="topbar" data-component="header" aria-label="Global Application Header"></header>

    <!-- MAIN APPLICATION CONTAINER -->
    <div class="layout-main-container">
      
      <!-- SIDEBAR NAVIGATION (Drawer trên mobile, Cột cố định trên Desktop) -->
      <aside class="layout-sidebar" aria-label="Sidebar Navigation">
        <section class="sidebar__section">
          <h2 class="sidebar__label">Weeks</h2>
          <nav data-component="week-list" aria-label="Danh sách lộ trình các tuần"></nav>
        </section>
      </aside>

      <!-- MAIN CONTENT AREA -->
      <main class="layout-content">
        <!-- Dải băng tiến độ toàn cục -->
        <section class="mission-tape" data-component="mission-tape" aria-label="Dải băng tiến độ toàn cục"></section>
        
        <!-- Thanh bộ lọc và tìm kiếm -->
        <section class="filter-bar" data-component="filter-bar" aria-label="Bộ lọc và tìm kiếm nhiệm vụ"></section>
        
        <!-- Metadata tiêu đề và Gate Criteria của tuần -->
        <header class="week-header" data-component="week-header"></header>
        
        <!-- Bảng danh sách Task -->
        <section class="task-area" data-component="task-table" aria-label="Danh sách nhiệm vụ chi tiết"></section>
        
        <!-- Playbook hướng dẫn thực chiến -->
        <section class="playbook-area" data-component="playbook" aria-label="Playbook hướng dẫn"></section>
        
        <!-- Nhật ký nghiên cứu (Notes) -->
        <section class="notes-area" data-component="notes" aria-label="Ghi chú nghiên cứu"></section>
      </main>

    </div>
  </div>

  <!-- Application Bootstrap (ES Module duy nhất) -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
