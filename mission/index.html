<title>Mission Control — Embodied AI VLA 1</title>
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --border: #252a38;
    --border2: #2e3448;
    --text: #e2e6f0;
    --text2: #8892a8;
    --text3: #525f7a;
    --p1: #4f8ef7;
    --p2: #a78bfa;
    --p3: #34d399;
    --p4: #fb923c;
    --done: #22c55e;
    --warn: #f59e0b;
    --red: #ef4444;
    --accent: #4f8ef7;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }

  /* TOP BAR */
  #topbar {
    height: 44px; background: var(--bg2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 16px; position: sticky; top: 0; z-index: 100;
  }
  #topbar .logo { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 2px; font-weight: 700; }
  #topbar .sep { width: 1px; height: 20px; background: var(--border2); }
  #topbar .phase-pills { display: flex; gap: 6px; }
  .phase-pill { padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border2); font-size: 11px; cursor: pointer; color: var(--text2); transition: all .15s; background: transparent; }
  .phase-pill.active, .phase-pill:hover { color: #fff; border-color: transparent; }
  .phase-pill[data-p="1"].active { background: var(--p1); }
  .phase-pill[data-p="2"].active { background: var(--p2); }
  .phase-pill[data-p="3"].active { background: var(--p3); color: #000; }
  .phase-pill[data-p="4"].active { background: var(--p4); }
  .phase-pill[data-p="1"]:hover { background: var(--p1); color: #fff; }
  .phase-pill[data-p="2"]:hover { background: var(--p2); color: #fff; }
  .phase-pill[data-p="3"]:hover { background: var(--p3); color: #000; }
  .phase-pill[data-p="4"]:hover { background: var(--p4); color: #fff; }
  #topbar .spacer { flex: 1; }
  #topbar .global-stats { display: flex; gap: 16px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--text2); }
  .stat-val { color: var(--text); font-weight: 700; }
  #topbar .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
  #topbar .sync-dot.ok { background: var(--done); }

  /* LAYOUT */
  #app { display: flex; flex: 1; min-height: 0; }

  /* SIDEBAR */
  #sidebar {
    width: 220px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; position: sticky; top: 44px; height: calc(100vh - 44px);
  }
  .sidebar-section { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--text3); padding: 0 14px 8px; text-transform: uppercase; }
  .week-item { display: flex; align-items: center; gap: 8px; padding: 5px 14px; cursor: pointer; border-left: 2px solid transparent; transition: all .1s; }
  .week-item:hover { background: var(--bg3); }
  .week-item.active { border-left-color: var(--accent); background: var(--bg3); }
  .week-item .wnum { font-family: var(--mono); font-size: 10px; color: var(--text3); width: 20px; }
  .week-item .wtitle { font-size: 11px; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-item .wpct { font-family: var(--mono); font-size: 10px; color: var(--text3); }
  .week-item.active .wtitle { color: var(--text); }
  .week-spark { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .spark-bar { width: 3px; background: var(--border2); border-radius: 1px; min-height: 2px; }
  .spark-bar.done { background: var(--done); }

  /* MAIN */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* MISSION TAPE */
  #mission-tape {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 0 20px; display: flex; align-items: center; gap: 0; overflow-x: auto; height: 52px;
  }
  .tape-phase { display: flex; align-items: center; gap: 0; }
  .tape-seg {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 16px; height: 52px; border-right: 1px solid var(--border); cursor: pointer;
    min-width: 80px; position: relative; transition: background .15s;
  }
  .tape-seg:hover { background: var(--bg3); }
  .tape-seg.current { background: rgba(79,142,247,.08); }
  .tape-seg .ts-label { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
  .tape-seg .ts-title { font-size: 10px; color: var(--text2); white-space: nowrap; }
  .tape-seg .ts-bar { position: absolute; bottom: 0; left: 0; height: 2px; border-radius: 0; transition: width .3s; }

  /* WEEK HEADER */
  #week-header {
    padding: 20px 24px 0; display: flex; align-items: flex-start; gap: 20px;
  }
  .wh-badge { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .wh-meta { flex: 1; }
  .wh-phase { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
  .wh-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .wh-sub { font-size: 12px; color: var(--text2); }
  .wh-gate { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 14px; }
  .wh-gate-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 4px; }
  .wh-gate-text { font-size: 12px; color: var(--text); font-family: var(--mono); }

  /* TASK TABLE */
  #task-area { padding: 16px 24px 24px; }
  .task-table { width: 100%; border-collapse: collapse; }
  .task-table thead th { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); padding: 0 10px 8px; text-align: left; }
  .task-table thead th:first-child { padding-left: 0; }
  .task-row { border-top: 1px solid var(--border); transition: background .1s; }
  .task-row:hover { background: var(--bg3); }
  .task-row td { padding: 9px 10px; vertical-align: top; }
  .task-row td:first-child { padding-left: 0; }
  .task-check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; margin-top: 1px; }
  .task-check.done { background: var(--done); border-color: var(--done); }
  .task-check.done::after { content: '✓'; font-size: 10px; color: #000; font-weight: 700; }
  .task-check-cell { width: 28px; }
  .task-day { font-family: var(--mono); font-size: 10px; color: var(--text3); white-space: nowrap; width: 40px; padding-top: 2px; }
  .task-title { font-size: 12px; color: var(--text); font-weight: 500; }
  .task-title.done-text { text-decoration: line-through; color: var(--text3); }
  .task-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .task-tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; margin-right: 4px; }
  .tag-read { background: rgba(79,142,247,.15); color: var(--p1); }
  .tag-code { background: rgba(167,139,250,.15); color: var(--p2); }
  .tag-paper { background: rgba(52,211,153,.15); color: var(--p3); }
  .tag-run { background: rgba(251,146,60,.15); color: var(--p4); }
  .tag-write { background: rgba(245,158,11,.15); color: var(--warn); }
  .task-output { font-size: 11px; color: var(--text3); font-family: var(--mono); }

  /* PLAYBOOK */
  #playbook-area { padding: 0 24px 24px; }
  .section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .playbook-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pb-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .pb-card-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
  .pb-card-val { font-size: 12px; color: var(--text); }

  /* NOTES */
  #notes-area { padding: 0 24px 32px; }
  #notes-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 12px; font-family: var(--mono); padding: 10px 12px; resize: vertical; min-height: 60px; }
  #notes-input:focus { outline: none; border-color: var(--accent); }
  .notes-log { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .note-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
  .note-meta { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-bottom: 3px; }
  .note-text { font-size: 11px; color: var(--text2); }

  /* PROGRESS RING */
  .prog-ring { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
  .prog-ring svg { transform: rotate(-90deg); }
  .prog-ring .pct-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 9px; font-weight: 700; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    #sidebar { display: none; }
    .playbook-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .playbook-grid { grid-template-columns: 1fr; }
  }
  
  /* Filter bar */
  #filter-bar { padding: 12px 24px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
  .filter-btn { padding: 3px 10px; border-radius: 10px; border: 1px solid var(--border2); font-size: 11px; cursor: pointer; color: var(--text2); background: transparent; transition: all .1s; }
  .filter-btn.active { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  #search-input { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 11px; padding: 4px 10px; outline: none; width: 160px; }
  #search-input:focus { border-color: var(--accent); }
</style>

// Khởi tạo State ban đầu
let state = { done: {}, notes: {}, currentWeek: 1, currentPhase: 1, filter: 'all', search: '' };
const KEY = 'vla_mc_state_v2';

// Hàm bất đồng bộ tải dữ liệu (Phối hợp Realtime lắng nghe Firebase và Local làm backup)
async function loadState() {
  // 1. Phục hồi từ LocalStorage trước để giao diện hiển thị ngay lập tức
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const localData = JSON.parse(s);
      state.done = Object.assign({}, state.done, localData.done || {});
      state.notes = Object.assign({}, state.notes, localData.notes || {});
    }
  } catch(e) { console.warn("LocalStorage load blocked.", e); }

  // 2. Nếu có kết nối Firebase, lấy data mới nhất về đè lên bản Local
  if (db) {
    try {
      const snap = await db.ref(KEY).get();
      if (snap.exists()) {
        const fbData = snap.val();
        state.done = Object.assign({}, state.done, fbData.done || {});
        state.notes = Object.assign({}, state.notes, fbData.notes || {});
      }
    } catch(e) { console.error("Firebase get state error:", e); }
  }
}

// Hàm đồng bộ lưu trữ lên đám mây và lưu cục bộ song song
async function saveState() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch(e) { console.warn("LocalStorage save blocked.", e); }

  if (db) {
    try {
      await db.ref(KEY).set(state);
    } catch(e) { console.error("Firebase write state error:", e); }
  }
}

function phaseColor(p) { return ['','var(--p1)','var(--p2)','var(--p3)','var(--p4)'][p] || 'var(--p1)'; }

function weekDoneCount(w) {
  const week = WEEKS.find(x => x.w === w);
  if (!week) return [0, 0];
  const done = week.tasks.filter(t => state.done[`${w}_${t.day}_${t.title.slice(0,20)}`]).length;
  return [done, week.tasks.length];
}

function globalStats() {
  let done = 0, total = 0;
  WEEKS.forEach(w => { const [d, t] = weekDoneCount(w.w); done += d; total += t; });
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}

function renderTopbar() {
  const s = globalStats();
  document.getElementById('g-done').textContent = s.done;
  document.getElementById('g-total').textContent = s.total;
  document.getElementById('g-pct').textContent = s.pct;
  document.getElementById('g-week').textContent = `W${state.currentWeek}`;
}

function renderSidebar() {
  const list = document.getElementById('week-list');
  const phaseWeeks = WEEKS.filter(w => w.phase === state.currentPhase);
  list.innerHTML = phaseWeeks.map(w => {
    const [done, total] = weekDoneCount(w.w);
    const pct = total ? Math.round(done/total*100) : 0;
    const active = w.w === state.currentWeek ? 'active' : '';
    const bars = w.tasks.map(t => {
      const isDone = state.done[`${w.w}_${t.day}_${t.title.slice(0,20)}`];
      const h = 4 + Math.floor(Math.random() * 8);
      return `<div class="spark-bar ${isDone?'done':''}" style="height:${h}px"></div>`;
    }).join('');
    return `<div class="week-item ${active}" data-w="${w.w}">
      <span class="wnum">${w.w}</span>
      <span class="wtitle">${w.title}</span>
      <div class="week-spark">${bars}</div>
      <span class="wpct">${pct}%</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.week-item').forEach(el => {
    el.addEventListener('click', () => { state.currentWeek = +el.dataset.w; render(); });
  });
}

function renderTape() {
  const tape = document.getElementById('mission-tape');
  tape.innerHTML = PHASES.map(ph => {
    const phWeeks = WEEKS.filter(w => w.phase === ph.id);
    const segs = phWeeks.map(w => {
      const [done, total] = weekDoneCount(w.w);
      const pct = total ? done/total*100 : 0;
      const current = w.w === state.currentWeek ? 'current' : '';
      return `<div class="tape-seg ${current}" data-w="${w.w}">
        <div class="ts-label" style="color:${phaseColor(ph.id)}">W${w.w}</div>
        <div class="ts-title">${w.title.split('—')[0].trim().slice(0,18)}</div>
        <div class="ts-bar" style="width:${pct}%;background:${phaseColor(ph.id)}"></div>
      </div>`;
    }).join('');
    return `<div class="tape-phase">${segs}</div>`;
  }).join('');
  tape.querySelectorAll('.tape-seg').forEach(el => {
    el.addEventListener('click', () => {
      const w = WEEKS.find(x => x.w === +el.dataset.w);
      if (w) { state.currentPhase = w.phase; state.currentWeek = w.w; render(); }
    });
  });
}

function tagClass(tag) {
  return {read:'tag-read',code:'tag-code',paper:'tag-paper',run:'tag-run',write:'tag-write'}[tag] || 'tag-read';
}
function tagLabel(tag) {
  return {read:'📖 Read',code:'💻 Code',paper:'📄 Paper',run:'🔬 Run',write:'✍️ Write'}[tag] || tag;
}

function renderWeek() {
  const week = WEEKS.find(w => w.w === state.currentWeek);
  if (!week) return;
  const phColor = phaseColor(week.phase);

  // Header
  const hdr = document.getElementById('week-header');
  hdr.innerHTML = `
    <div class="wh-badge" style="background:${phColor}22;color:${phColor}">W${week.w}</div>
    <div class="wh-meta">
      <div class="wh-phase" style="color:${phColor}">Phase ${week.phase} — ${PHASES[week.phase-1].title}</div>
      <div class="wh-title">${week.title}</div>
      <div class="wh-sub">${week.sub}</div>
    </div>
    <div class="wh-gate">
      <div class="wh-gate-label">✓ Gate Criteria</div>
      <div class="wh-gate-text">${week.gate}</div>
    </div>`;

  // Tasks
  let tasks = week.tasks;
  if (state.filter !== 'all') tasks = tasks.filter(t => t.tag === state.filter);
  if (state.search) {
    const q = state.search.toLowerCase();
    tasks = tasks.filter(t => t.title.toLowerCase().includes(q) || (t.sub||'').toLowerCase().includes(q));
  }

  const taskArea = document.getElementById('task-area');
  const rows = tasks.map(t => {
    const key = `${week.w}_${t.day}_${t.title.slice(0,20)}`;
    const done = !!state.done[key];
    return `<tr class="task-row">
      <td class="task-check-cell"><div class="task-check ${done?'done':''}" data-key="${key}"></div></td>
      <td class="task-day">${t.day}</td>
      <td>
        <span class="task-tag ${tagClass(t.tag)}">${tagLabel(t.tag)}</span>
        <span class="task-title ${done?'done-text':''}">${t.title}</span>
        ${t.sub ? `<div class="task-sub">${t.sub}</div>` : ''}
      </td>
      <td class="task-output">${t.out||''}</td>
    </tr>`;
  }).join('');
  taskArea.innerHTML = `<table class="task-table">
    <thead><tr>
      <th></th><th>Day</th><th>Task</th><th>Output</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  // Thêm logic đồng bộ hóa giao diện an toàn
  taskArea.querySelectorAll('.task-check').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.stopPropagation(); // Ngăn lỗi nổi bọt sự kiện gây đứng màn hình
      const k = el.dataset.key;
      state.done[k] = !state.done[k];
      
      // Render UI local trước để tạo cảm giác bấm mượt không độ trễ
      render();
      
      // Đẩy data ngầm lên Firebase / LocalStorage sau
      await saveState();
    });
  });

  // Playbook
  const pb = document.getElementById('playbook-area');
  if (week.playbook) {
    pb.innerHTML = `<div class="section-title">Playbook</div>
      <div class="playbook-grid">${week.playbook.map(p => `
        <div class="pb-card">
          <div class="pb-card-label">${p.k}</div>
          <div class="pb-card-val">${p.v}</div>
        </div>`).join('')}
      </div>`;
  } else { pb.innerHTML = ''; }

  // Notes
  const na = document.getElementById('notes-area');
  const notesLog = state.notes[state.currentWeek] || [];
  na.innerHTML = `<div class="section-title">Notes</div>
    <textarea id="notes-input" placeholder="Ghi chú cho tuần này… (Ctrl+Enter để lưu)"></textarea>
    <div class="notes-log">${notesLog.map(n => `
      <div class="note-item">
        <div class="note-meta">${n.date}</div>
        <div class="note-text">${n.text}</div>
      </div>`).join('')}
    </div>`;
  document.getElementById('notes-input').addEventListener('keydown', async e => {
    if (e.ctrlKey && e.key === 'Enter') {
      const txt = e.target.value.trim();
      if (!txt) return;
      if (!state.notes[state.currentWeek]) state.notes[state.currentWeek] = [];
      state.notes[state.currentWeek].unshift({ text: txt, date: new Date().toLocaleString('vi-VN') });
      e.target.value = '';
      render();
      await saveState();
    }
  });
}

function render() {
  document.querySelectorAll('.phase-pill').forEach(el => {
    el.classList.toggle('active', +el.dataset.p === state.currentPhase);
  });
  renderTopbar();
  renderSidebar();
  renderTape();
  renderWeek();
}

// Event listeners
document.querySelectorAll('.phase-pill').forEach(el => {
  el.addEventListener('click', () => {
    state.currentPhase = +el.dataset.p;
    const firstWeek = WEEKS.find(w => w.phase === state.currentPhase);
    if (firstWeek) state.currentWeek = firstWeek.w;
    render();
  });
});

document.querySelectorAll('.filter-btn').forEach(el => {
  el.addEventListener('click', () => {
    state.filter = el.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === el));
    renderWeek();
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  renderWeek();
});

// Chạy khởi tạo an toàn sau khi load DOM tree thành công
window.addEventListener('DOMContentLoaded', async () => {
  await loadState();
  render();
});
</script>
</body>
</html>
