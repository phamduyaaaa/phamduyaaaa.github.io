<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="seoTitle">Thiệp Mời Tốt Nghiệp - Phạm Đức Duy</title>
<meta name="description" id="seoDesc" content="Trân trọng kính mời bạn đến dự lễ tốt nghiệp...">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="Thiệp Mời Tốt Nghiệp">
<meta property="og:description" id="ogDesc" content="Sự hiện diện của bạn là niềm vinh hạnh lớn nhất">
<meta property="og:image" id="ogImage" content="imgs/anh-share-link.jpg">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant Garamond:wght@600;700;800&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --navy-deep: #061123;
    --navy-royal: #0D2247;
    --gold-metallic: #D4AF37;
    --gold-light: #F4E8C1;
    --text-main: #1A2433;
    --text-muted: #526071;
    --paper-cream: #FCFBF9;
    --paper-shadow: rgba(6, 17, 35, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  
  body {
    background-color: #ECE8E1;
    background-image: 
      radial-gradient(at 50% 0%, #FFFFFF 0%, transparent 75%),
      radial-gradient(at 50% 100%, #DFD9CE 0%, #ECE8E1 100%);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 12px;
  }

  .font-serif { font-family: 'Cormorant Garamond', serif; }
  .font-script { font-family: 'Great Vibes', cursive; }

  /* --- KHUNG THIỆP CHÍNH --- */
  .invitation-card {
    width: 100%;
    max-width: 440px;
    background-color: var(--paper-cream);
    background-image: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(252,251,249,0.95) 100%);
    border-radius: 36px;
    box-shadow: 
      0 30px 60px -12px var(--paper-shadow),
      0 18px 36px -18px rgba(0, 0, 0, 0.1),
      inset 0 0 0 1px rgba(255, 255, 255, 0.9),
      inset 0 0 30px rgba(244, 232, 193, 0.2);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
  }

  /* ==========================================================
     RUY BĂNG CỬ NHÂN - MÔ HÌNH KHỚP NÓI ĐÔI & GỢN SÓNG VẬT LÝ THẬT
     ========================================================== */
  /* Khớp 1: Neo tại vai (Nửa trên di chuyển nhẹ nhàng) */
  .stole-wrapper {
    position: absolute; top: -4px; left: 18px;
    width: 82px;
    height: 380px; /* Đã thu ngắn lại cho cân đối chuẩn bản gốc */
    z-index: 25;
    pointer-events: none;
    transform-origin: top center;
    animation: topShoulderSway 6s ease-in-out infinite alternate;
  }

  /* Khớp 2: Thân và đuôi ruy băng (Nửa dưới chịu gió, tạo gợn sóng gấp & co ngắn lại) */
  .stole-fabric-body {
    width: 100%; height: 100%;
    position: relative;
    background: linear-gradient(
      105deg,
      #030812 0%,
      #0a1830 18%,
      #132b53 45%, 
      #1a3869 50%, 
      #132b53 55%, 
      #0a1830 82%,
      #030812 100%
    );
    clip-path: polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
    /* Điểm xoay uốn lượn đặt ở khoảng giữa ruy băng */
    transform-origin: center 120px;
    will-change: transform, filter;
    animation: bottomWaveFold 6s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate;
    box-shadow: inset 0 0 18px rgba(0,0,0,0.95);
    filter: drop-shadow(6px 12px 14px rgba(3, 8, 18, 0.5)) drop-shadow(14px 22px 28px rgba(6, 17, 35, 0.35));
    display: flex; flex-direction: column; align-items: center;
    padding-top: 12px;
  }

  .stole-border {
    position: absolute; inset: 0 5px 3px 5px;
    border-left: 1.8px solid var(--gold-metallic);
    border-right: 1.8px solid var(--gold-metallic);
    clip-path: polygon(0 0, 100% 0, 100% 88%, 50% 99%, 0 88%);
    box-shadow: inset 0 0 4px rgba(212, 175, 55, 0.4);
    opacity: 0.9;
  }

  .stole-fabric-body::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.18) 45%, transparent 75%);
    background-size: 100% 200%;
    animation: silkShine 6s ease-in-out infinite alternate;
  }

  .stole-logo-slot {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 2px solid var(--gold-metallic);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; 
    margin-bottom: 10px; z-index: 3;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8), inset 0 0 5px rgba(0, 0, 0, 0.25);
    flex-shrink: 0;
  }
  .stole-logo-slot img { 
    position: absolute; inset: 0; width: 100%; height: 100%; 
    object-fit: cover; background: #FFFFFF; padding: 0;
    transform: scale(1.15); z-index: 2;
  }
  .stole-logo-fallback { 
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: var(--navy-deep); 
    z-index: 1; background: #FFF;
  }

  .stole-text-group { display: flex; justify-content: center; gap: 6px; height: 60%; z-index: 2; }
  .vertical-text { 
    writing-mode: vertical-rl; text-orientation: mixed; 
    color: #FFFDF7; 
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 12px rgba(212, 175, 55, 0.4); 
    user-select: none; font-weight: 700;
  }
  .text-school { font-family: 'Montserrat', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 2px; color: #EAD396; opacity: 0.95; }
  .text-name { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 800; letter-spacing: 3.5px; }

  .stole-divider {
    width: 46px; height: 1.5px;
    background: linear-gradient(90deg, transparent, #F4E8C1, var(--gold-metallic), #F4E8C1, transparent);
    margin-top: auto; margin-bottom: 6px; z-index: 2;
    box-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }

  .stole-badge { 
    margin-bottom: 20px; color: #FFFDF7; 
    font-family: 'Cormorant Garamond', serif;
    font-size: 12.5px; font-weight: 800; letter-spacing: 2.5px; 
    z-index: 2; text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 10px rgba(212, 175, 55, 0.5); 
  }

  /* KỊCH BẢN VẬT LÝ: Nửa trên chuyển động nhẹ, nửa dưới gợn sóng gấp & co ngắn lại */
  @keyframes topShoulderSway {
    0% { transform: rotateZ(0deg); }
    100% { transform: rotateZ(-1.2deg); } /* Nửa trên dao động nhẹ nhàng */
  }

  @keyframes bottomWaveFold {
    0% {
      transform: perspective(800px) rotateX(0deg) skewY(0deg) scaleY(1);
    }
    50% {
      /* Gió thổi nửa dưới: uốn gợn sóng (rotateX), xô lệch nhẹ (skewY) và co ngắn lại (scaleY = 0.97) */
      transform: perspective(800px) rotateX(6deg) skewY(1.5deg) scaleY(0.97);
    }
    100% {
      transform: perspective(800px) rotateX(-2deg) skewY(-0.8deg) scaleY(0.99);
    }
  }

  @keyframes silkShine { 0% { background-position: 0% 0%; } 100% { background-position: 0% 100% } }

  /* --- HERO SECTION --- */
  .hero-section { width: 100%; padding: 40px 22px 10px 22px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; }
  .header-titles { width: 100%; padding-left: 95px; text-align: right; margin-bottom: 22px; }
  .uni-logo { font-size: 15px; font-weight: 800; color: var(--navy-deep); letter-spacing: 1.5px; }
  .uni-sub { font-size: 7px; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; font-weight: 600; }
  .title-main { font-size: 26px; font-weight: 700; color: var(--navy-deep); letter-spacing: 1.5px; line-height: 1; }
  .title-script { font-size: 42px; color: var(--navy-royal); margin-top: -10px; margin-right: 4px; font-weight: normal; }

  .photo-showcase {
    width: 92%; height: 450px;
    border-radius: 28px; overflow: hidden; position: relative;
    box-shadow: 0 20px 40px -10px rgba(6, 17, 35, 0.25), inset 0 0 0 1px rgba(255,255,255,0.2);
    background-color: #E2E8F0;
    margin-bottom: 20px;
  }
  .photo-showcase img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1); }
  .photo-showcase:hover img { transform: scale(1.04); }

  .signature-overlay {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center; font-size: 56px; color: var(--navy-deep);
    text-shadow: 
      0 0 12px rgba(255, 255, 255, 0.95),
      0 0 25px rgba(255, 255, 255, 1),
      0 2px 8px rgba(0, 0, 0, 0.15);
    z-index: 20; pointer-events: none; line-height: 1;
  }

  .quote-box { text-align: center; padding: 0 25px; margin-top: 15px; margin-bottom: 15px; }
  .quote-text { font-size: 13.5px; font-weight: 600; color: var(--navy-deep); letter-spacing: 2px; line-height: 1.6; }

  /* --- PHẦN "THÂN MỜI" OVERLAPPING --- */
  .invite-card-section { width: 100%; padding: 15px 18px 25px 18px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; }
  .invite-white-box {
    width: 94%; background: #FFFFFF; border-radius: 30px; padding: 38px 20px 32px 20px; text-align: center;
    box-shadow: 0 25px 50px -12px rgba(6, 17, 35, 0.15); border: 1px solid rgba(0,0,0,0.04);
    position: relative; z-index: 10; margin-bottom: -50px;
  }
  .invite-title { font-size: 16px; font-weight: 700; color: var(--navy-deep); letter-spacing: 3px; margin-bottom: 24px; }
  .invite-time { font-size: 15px; font-weight: 700; color: var(--navy-royal); letter-spacing: 1px; margin-bottom: 12px; }
  .date-display-box { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 28px; }
  .date-side { font-size: 13px; font-weight: 700; color: var(--navy-royal); letter-spacing: 2px; border-bottom: 1.5px solid var(--navy-royal); padding-bottom: 5px; text-transform: uppercase; }
  .date-main { font-size: 64px; font-weight: 700; color: var(--navy-deep); line-height: 0.85; font-family: 'Cormorant Garamond', serif; }
  .invite-sub-label { font-size: 12.5px; font-weight: 500; color: var(--text-muted); font-style: italic; margin-bottom: 8px; }
  .invite-venue-name { font-size: 18px; font-weight: 700; color: var(--navy-deep); letter-spacing: 1px; margin-bottom: 4px; }
  .invite-room { font-size: 15px; font-weight: 600; color: var(--navy-royal); margin-bottom: 12px; }
  .invite-address { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; max-width: 280px; margin: 0 auto 28px auto; }
  .btn-direction { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: transparent; border: 1.5px solid var(--navy-royal); border-radius: 50px; font-size: 12px; font-weight: 700; color: var(--navy-royal); text-transform: uppercase; letter-spacing: 2px; text-decoration: none; transition: all 0.3s; }
  .btn-direction:hover { background: var(--navy-royal); color: #FFF; box-shadow: 0 8px 20px rgba(13, 34, 71, 0.25); }
  .btn-direction svg { width: 16px; height: 16px; fill: currentColor; }
  .campus-photo-box { width: 94%; height: 320px; border-radius: 26px; overflow: hidden; position: relative; z-index: 5; box-shadow: 0 15px 35px rgba(6, 17, 35, 0.18); background-color: #CBD5E1; }
  .campus-photo-box img { width: 100%; height: 100%; object-fit: cover; }

  /* --- THƯỚC PHIM CUỘN & GIẤY RÁCH XƠ SỢI --- */
  .filmstrip-wrapper { width: 100%; margin: 40px 0 25px 0; position: relative; z-index: 15; }
  .film-header { text-align: center; margin-bottom: 18px; }
  .film-header .script-word { font-size: 50px; color: var(--navy-royal); line-height: 0.8; font-weight: normal; }
  .film-header .serif-word { font-size: 14px; color: var(--text-muted); font-weight: 600; letter-spacing: 5px; text-transform: uppercase; margin-left: 55px; display: block; margin-top: 4px; }
  .film-container { width: 100%; background: #08101E; padding: 38px 14px; position: relative; display: flex; gap: 14px; align-items: stretch; height: 530px; box-shadow: 0 20px 40px -10px rgba(6, 17, 35, 0.4); }
  .torn-edge { position: absolute; left: 0; right: 0; width: 100%; height: 26px; z-index: 10; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5)); }
  .torn-edge.top { top: -1px; }
  .torn-edge.bottom { bottom: -1px; transform: rotate(180deg); }
  .torn-edge svg { width: 100%; height: 100%; display: block; }
  .fiber-layer-shadow { fill: rgba(252, 251, 249, 0.35); }
  .fiber-layer-main { fill: var(--paper-cream); }
  .film-left-col { width: 44%; background: #0E1A2E; border-radius: 6px; position: relative; overflow: hidden; padding: 8px 12px; box-shadow: inset 0 0 18px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
  .film-left-col::before, .film-left-col::after { content: ""; position: absolute; top: 0; bottom: 0; width: 5px; background: repeating-linear-gradient(to bottom, transparent 0px, transparent 6px, rgba(255,255,255,0.35) 6px, rgba(255,255,255,0.35) 12px); z-index: 5; }
  .film-left-col::before { left: 3px; }
  .film-left-col::after { right: 3px; }
  .film-track { display: flex; flex-direction: column; gap: 14px; width: 100%; animation: filmRollUp 18s linear infinite; }
  .film-left-col:hover .film-track { animation-play-state: paused; }
  .film-frame { width: 100%; aspect-ratio: 4/3; border-radius: 6px; overflow: hidden; border: 2px solid rgba(255,255,255,0.85); background: #1E293B; flex-shrink: 0; box-shadow: 0 6px 12px rgba(0,0,0,0.5); }
  .film-frame img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes filmRollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
  .film-right-col { width: 56%; border-radius: 12px; overflow: hidden; position: relative; background: #1E293B; box-shadow: 0 12px 28px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.15); }
  .film-right-col img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1); }
  .film-right-col:hover img { transform: scale(1.05); }

  /* --- NỘI DUNG DƯỚI (LƯU BÚT, ALBUM, RSVP) --- */
  .content-section { width: 100%; padding: 15px 24px 25px 24px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
  .section-divider { width: 60%; height: 1px; background: linear-gradient(90deg, transparent, rgba(197, 155, 39, 0.35), transparent); margin: 20px 0 35px 0; }
  .sec-title { font-size: 18px; color: var(--navy-deep); font-weight: 700; letter-spacing: 2px; margin-bottom: 22px; text-align: center; }
  .luubut-box { width: 100%; padding: 15px 10px 10px 10px; margin: 10px 0 25px 0; text-align: center; position: relative; z-index: 10; }
  .luubut-title { font-size: 54px; color: #718096; line-height: 0.9; margin-bottom: 24px; font-weight: normal; }
  .luubut-body { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; padding: 0 8px; }
  .luubut-paragraph { font-size: 13.5px; line-height: 1.9; color: #2D3748; text-align: left; font-weight: 400; font-family: 'Lora', serif; }
  .luubut-signature { font-size: 50px; color: #718096; line-height: 1; margin-top: 5px; }
  .album-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; margin-bottom: 30px; }
  .album-card { aspect-ratio: 4/5; background-color: #CBD5E1; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 10px 22px -4px rgba(6, 17, 35, 0.12); border: 3px solid #FFFFFF; }
  .album-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
  .album-card:hover img { transform: scale(1.06); }
  .rsvp-box { background: #FFFFFF; border-radius: 26px; padding: 38px 22px; width: 100%; text-align: center; border: 1px solid rgba(197, 155, 39, 0.3); box-shadow: 0 16px 36px -8px rgba(6, 17, 35, 0.06); }
  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--navy-deep); }
  .form-control { width: 100%; padding: 13px 16px; border: 1px solid #CBD5E1; border-radius: 12px; font-family: inherit; font-size: 13.5px; color: var(--text-main); transition: all 0.3s; background: #FAF9F6; }
  .form-control:focus { outline: none; border-color: var(--navy-royal); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(13, 34, 71, 0.08); }
  .btn-submit { background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-royal) 100%); color: #FFF; border: none; padding: 15px 30px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 2.5px; font-weight: 700; cursor: pointer; transition: all 0.3s; width: 100%; border-radius: 12px; margin-top: 10px; box-shadow: 0 10px 22px -4px rgba(13, 34, 71, 0.3); }
  .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 14px 26px -4px rgba(13, 34, 71, 0.4); }
  .btn-submit:disabled { background: #94A3B8; cursor: not-allowed; box-shadow: none; transform: none; }
  .form-feedback { margin-top: 16px; font-size: 13px; font-weight: 600; display: none; }

  footer { margin-top: 35px; text-align: center; font-size: 11px; color: var(--text-muted); letter-spacing: 1.5px; opacity: 0.8; }

  @media (max-width: 380px) {
    .stole-wrapper { width: 74px; height: 350px; left: 14px; }
    .stole-logo-slot { width: 44px; height: 44px; }
    .header-titles { padding-left: 85px; }
    .title-main { font-size: 23px; }
    .title-script { font-size: 36px; }
    .photo-showcase { height: 390px; }
    .signature-overlay { font-size: 48px; }
    .date-main { font-size: 54px; }
    .invite-white-box { padding: 30px 15px 25px 15px; }
    .film-container { height: 460px; padding: 30px 8px; }
    .luubut-title { font-size: 46px; }
    .luubut-signature { font-size: 44px; }
  }
</style>
</head>
<body>

<div class="invitation-card">

  <!-- RUY BĂNG CỬ NHÂN - MÔ HÌNH VẬT LÝ SÓNG LỤA MỀM MẠI -->
  <div class="stole-wrapper">
    <div class="stole-fabric-body">
      <div class="stole-border"></div>
      <div class="stole-logo-slot">
        <img id="uiStoleLogoImg" src="" alt="Logo Trường" loading="eager">
        <span class="stole-logo-fallback font-serif" id="uiStoleFallbackLogo"></span>
      </div>
      <div class="stole-text-group">
        <div class="vertical-text text-school" id="uiSchoolName"></div>
        <div class="vertical-text text-name" id="uiPersonName"></div>
      </div>
      <div class="stole-divider"></div>
      <div class="stole-badge" id="uiCohort"></div>
    </div>
  </div>

  <!-- HERO SECTION -->
  <div class="hero-section">
    <div class="header-titles">
      <div class="uni-logo font-serif" id="uiSchoolLogo">PHENIKAA</div>
      <div class="uni-sub" id="uiSubLogo">UNIVERSITY</div>
      <div class="title-main font-serif" id="uiGradTitle">GRADUATION</div>
      <div class="title-script font-script" id="uiCeremony">Ceremony</div>
    </div>

    <!-- KHUNG ẢNH TRUNG TÂM KÈM CHỮ KÝ GIAO THOA TRỰC TIẾP -->
    <div class="photo-showcase">
      <img id="uiMainPhoto" src="" alt="Graduation Portrait" loading="eager">
      <div class="signature-overlay font-script" id="uiSignature"></div>
    </div>

    <div class="quote-box">
      <div class="quote-text font-serif" id="uiQuote"></div>
    </div>
  </div>

  <!-- PHẦN "THÂN MỜI" OVERLAPPING TRÙM ẢNH TRƯỜNG -->
  <div class="invite-card-section">
    <div class="invite-white-box">
      <div class="invite-title font-serif">THÂN MỜI</div>
      <div class="invite-time font-serif" id="uiInviteTime">08:00, CHỦ NHẬT</div>
      
      <div class="date-display-box">
        <span class="date-side" id="uiInviteMonth">THÁNG 07</span>
        <span class="date-main font-serif" id="uiInviteDay">26</span>
        <span class="date-side" id="uiInviteYear">NĂM 2026</span>
      </div>

      <div class="invite-sub-label">Tại địa điểm:</div>
      <div class="invite-venue-name font-serif" id="uiInviteVenue">ĐẠI HỌC CÔNG NGHIỆP HÀ NỘI</div>
      <div class="invite-room" id="uiInviteRoom">(Hội trường A9-A10)</div>
      <div class="invite-address" id="uiInviteAddress">số 298 Cầu Diễn, quận Bắc Từ Liêm, Hà Nội, Việt Nam</div>

    <div class="album-grid" id="albumGrid"></div>

    <div class="rsvp-box">
      <p style="margin-bottom: 20px; color: var(--text-muted); font-size: 13px; line-height: 1.6;" id="uiRsvpNote"></p>
      <form id="rsvpForm" novalidate>
        <div class="form-group">
          <label for="guestName">Họ và tên của bạn: *</label>
          <input type="text" id="guestName" class="form-control" placeholder="Nhập tên của bạn..." required>
        </div>
        <div class="form-group">
          <label for="guestStatus">Bạn sẽ đến chứ? *</label>
          <select id="guestStatus" class="form-control" required>
            <option value="">-- Vui lòng chọn --</option>
            <option value="yes">Chắc chắn mình sẽ có mặt!</option>
            <option value="no">Tiếc quá, mình bận mất rồi</option>
          </select>
        </div>
        <div class="form-group">
          <label for="guestWish">Lời chúc gửi đến cử nhân:</label>
          <textarea id="guestWish" class="form-control" rows="2" placeholder="Gửi vài lời chúc tốt đẹp..."></textarea>
        </div>
        <button type="submit" class="btn-submit font-serif" id="submitBtn">Gửi Phản Hồi</button>
        <div class="form-feedback" id="formFeedback"></div>

    <footer id="uiFooter"></footer>

</div>

<script>
  /* ==========================================================
     1. SAAS DATA CONFIGURATION ENGINE
     ========================================================== */
  const TEMPLATE_CONFIG = {
    seo: {
      title: "Thiệp Mời Tốt Nghiệp - Phạm Đức Duy",
      description: "Trân trọng kính mời bạn đến dự lễ tốt nghiệp của Phạm Đức Duy tại ĐH Công Nghiệp Hà Nội.",
      ogImage: "imgs/anh-share-link.jpg"
    },
    person: {
      fullName: "Phạm Đức Duy",
      signatureName: "Đức Duy",
      schoolName: "ĐẠI HỌC CÔNG NGHIỆP HÀ NỘI",
      schoolShortLogo: "HaUI",
      schoolSubLogo: "UNIVERSITY",
      cohort: "K17",
      stoleLogoUrl: "imgs/logo-truong.png",
      mainPhotoUrl: "imgs/anh-chan-dung-chinh.jpg",
      quote: "EVERY END IS\nA NEW BEGINNING..."
    },
    invitation: {
      timeText: "08:00, CHỦ NHẬT",
      monthText: "THÁNG 07",
      dayNumber: "26",
      yearText: "NĂM 2026",
      venueName: "ĐẠI HỌC CÔNG NGHIỆP HÀ NỘI",
      roomName: "(Hội trường A9-A10)",
      address: "số 298 Cầu Diễn, quận Bắc Từ Liêm, Hà Nội, Việt Nam",
      mapUrl: "https://maps.google.com"
    },
    luubut: {
      paragraphs: [
        "Mỗi hành trình đều có một dấu mốc để ta dừng lại, nhìn về những điều đã qua và trân trọng từng kỷ niệm đẹp của tuổi thanh xuân.",
        "Mình thân mời gia đình, người thân và bạn bè đến tham dự lễ tốt nghiệp, cùng mình chia sẻ niềm vui và lưu giữ những khoảnh khắc thật đáng nhớ. Sự hiện diện của mọi người không chỉ làm ngày hôm ấy thêm trọn vẹn mà còn là món quà ý nghĩa nhất đối với mình.",
        "Mình rất mong được gặp và đón tiếp mọi người trong ngày đặc biệt này!"
      ],
      signature: "Đức Duy"
    },
    filmstrip: {
      rightFeaturedPhoto: "imgs/album-right.jpg",
      rollingPhotos: [
        "imgs/film-1.jpg",
        "imgs/film-2.jpg",
        "imgs/film-3.jpg",
        "imgs/film-4.jpg"
      ]
    },
    gallery: [
      { url: "imgs/album-1.jpg", caption: "Rạng rỡ ngày tốt nghiệp" },
      { url: "imgs/album-2.jpg", caption: "Thanh xuân K18" },
      { url: "imgs/album-3.jpg", caption: "Tung mũ cử nhân" },
      { url: "imgs/album-4.jpg", caption: "Kỷ niệm không thể quên" }
    ],
    rsvp: {
      deadlineText: "Vui lòng xác nhận sự hiện diện trước ngày 20/07/2026 để Lý chuẩn bị đón tiếp chu đáo nhất nhé!",
      webhookUrl: "https://jsonplaceholder.typicode.com/posts" 
    }
  };

  /* ==========================================================
     2. RENDER ENGINE & UI INJECTION
     ========================================================== */
  function initTemplate() {
    // SEO
    document.getElementById('seoTitle').innerText = TEMPLATE_CONFIG.seo.title;
    document.getElementById('seoDesc').setAttribute('content', TEMPLATE_CONFIG.seo.description);
    document.getElementById('ogTitle').setAttribute('content', TEMPLATE_CONFIG.seo.title);
    document.getElementById('ogDesc').setAttribute('content', TEMPLATE_CONFIG.seo.description);
    document.getElementById('ogImage').setAttribute('content', TEMPLATE_CONFIG.seo.ogImage);

    // --- XỬ LÝ THÔNG MINH LOGO TRƯỜNG TRÊN ĐỈNH RUY BĂNG ---
    const logoImg = document.getElementById('uiStoleLogoImg');
    const fallbackLogo = document.getElementById('uiStoleFallbackLogo');
    fallbackLogo.innerText = TEMPLATE_CONFIG.person.schoolShortLogo;
    
    logoImg.onload = () => { fallbackLogo.style.display = 'none'; };
    logoImg.onerror = () => { logoImg.style.display = 'none'; fallbackLogo.style.display = 'flex'; };
    logoImg.src = TEMPLATE_CONFIG.person.stoleLogoUrl;

    const schoolEl = document.getElementById('uiSchoolName');
    const nameEl = document.getElementById('uiPersonName');
    schoolEl.innerText = TEMPLATE_CONFIG.person.schoolName;
    nameEl.innerText = TEMPLATE_CONFIG.person.fullName.toUpperCase();
    document.getElementById('uiCohort').innerText = TEMPLATE_CONFIG.person.cohort;
    
    if (TEMPLATE_CONFIG.person.fullName.length > 18) nameEl.style.fontSize = "13px";
    if (TEMPLATE_CONFIG.person.schoolName.length > 25) schoolEl.style.fontSize = "8px";

    // Hero Header & Photo
    document.getElementById('uiSchoolLogo').innerText = TEMPLATE_CONFIG.person.schoolShortLogo;
    document.getElementById('uiSubLogo').innerText = TEMPLATE_CONFIG.person.schoolSubLogo;
    document.getElementById('uiGradTitle').innerText = "GRADUATION";
    document.getElementById('uiCeremony').innerText = "Ceremony";
    
    const img = document.getElementById("uiMainPhoto");

    img.onload = function () {
        img.style.display = "block";
    };

    img.onerror = function () {
        console.error("Không tải được ảnh:", img.src);
        img.style.display = "none";
    };

img.src = TEMPLATE_CONFIG.person.mainPhotoUrl;   
    document.getElementById('uiSignature').innerText = TEMPLATE_CONFIG.person.signatureName;
    document.getElementById('uiQuote').innerText = TEMPLATE_CONFIG.person.quote;
    
    // --- RENDER PHẦN THÂN MỜI ---
    document.getElementById('uiInviteTime').innerText = TEMPLATE_CONFIG.invitation.timeText;
    document.getElementById('uiInviteMonth').innerText = TEMPLATE_CONFIG.invitation.monthText;
    document.getElementById('uiInviteDay').innerText = TEMPLATE_CONFIG.invitation.dayNumber;
    document.getElementById('uiInviteYear').innerText = TEMPLATE_CONFIG.invitation.yearText;
    document.getElementById('uiInviteVenue').innerText = TEMPLATE_CONFIG.invitation.venueName;
    document.getElementById('uiInviteRoom').innerText = TEMPLATE_CONFIG.invitation.roomName;
    document.getElementById('uiInviteAddress').innerText = TEMPLATE_CONFIG.invitation.address;
    document.getElementById('uiInviteMapLink').href = TEMPLATE_CONFIG.invitation.mapUrl;
    
    document.getElementById('uiRsvpNote').innerText = TEMPLATE_CONFIG.rsvp.deadlineText;

    // --- RENDER THƯỚC PHIM CUỘN ---
    document.getElementById('uiRightAlbumPhoto').src = TEMPLATE_CONFIG.filmstrip.rightFeaturedPhoto;
    const filmTrack = document.getElementById('filmTrack');
    const photos = TEMPLATE_CONFIG.filmstrip.rollingPhotos;
    const seamlessList = [...photos, ...photos];
    filmTrack.innerHTML = seamlessList.map((url, idx) => `
      <div class="film-frame">
        <img src="${url}" alt="Film memory ${idx+1}" loading="lazy" onerror="this.style.display='none'">
      </div>
    `).join('');

    // --- RENDER PHẦN LƯU BÚT ---
    const luubutBody = document.getElementById('uiLuubutBody');
    luubutBody.innerHTML = TEMPLATE_CONFIG.luubut.paragraphs.map(pText => `
      <p class="luubut-paragraph">${pText}</p>
    `).join('');
    document.getElementById('uiLuubutSign').innerText = TEMPLATE_CONFIG.luubut.signature;

    // --- RENDER ALBUM KỶ YẾU GRID ---
    const albumGrid = document.getElementById('albumGrid');
    albumGrid.innerHTML = TEMPLATE_CONFIG.gallery.map(img => `
      <div class="album-card">
        <img src="${img.url}" alt="${img.caption}" loading="lazy" onerror="this.style.display='none'">
      </div>
    `).join('');

    document.getElementById('uiFooter').innerHTML = `<p class="font-serif" style="font-weight: 700; color: var(--navy-deep); margin-bottom: 4px;">${TEMPLATE_CONFIG.person.fullName.toUpperCase()} · 2026</p><p>Editorial Invitation Architecture</p>`;
  }

  /* ==========================================================
     3. RSVP WEBHOOK API
     ========================================================== */
  function initRsvpForm() {
    const form = document.getElementById('rsvpForm');
    const submitBtn = document.getElementById('submitBtn');
    const feedback = document.getElementById('formFeedback');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('guestName').value.trim();
      const status = document.getElementById('guestStatus').value;
      const wish = document.getElementById('guestWish').value.trim();

      if (!name || !status) {
        feedback.style.display = "block";
        feedback.style.color = "#DC2626";
        feedback.innerText = "Vui lòng nhập tên và chọn xác nhận tham dự!";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "ĐANG GỬI...";
      feedback.style.display = "none";

      try {
        const res = await fetch(TEMPLATE_CONFIG.rsvp.webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, status, wish, date: new Date().toISOString() })
        });

        if (res.ok || res.status === 201) {
          feedback.style.display = "block";
          feedback.style.color = "#16A34A";
          feedback.innerText = "🎉 Cảm ơn bạn! Phản hồi đã được gửi thành công.";
          form.reset();
        } else throw new Error("Error");
      } catch (err) {
        feedback.style.display = "block";
        feedback.style.color = "#DC2626";
        feedback.innerText = "Có lỗi kết nối. Vui lòng thử lại sau!";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "GỬI PHẢN HỒI";
      }
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    initTemplate();
    initRsvpForm();
  });
</script>
